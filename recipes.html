<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  if (localStorage.getItem('savour_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .recipe-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .recipe-toolbar input { flex:1; max-width:320px; }

  .toolbar-row { display:flex; align-items:center; gap:10px; }
  .icon-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; text-decoration:none; }
  .icon-btn:hover { background:var(--surface-2); border-color:var(--muted); }

  .action-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .recipe-tab-pill { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); }
  .recipe-tab-pill button { border:0; background:transparent; color:var(--text); padding:9px 18px; cursor:pointer; font-size:13px; font-family:var(--font-body); position:relative; display:flex; align-items:center; gap:6px; }
  .recipe-tab-pill button:not(:last-child)::after { content:""; position:absolute; right:0; top:22%; bottom:22%; width:1px; background:var(--line); }
  .recipe-tab-pill button:hover { background:var(--surface-2); }
  .recipe-tab-pill button.active { background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
  .recipe-tab-pill svg { display:block; }

  .recipe-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .recipe-card { position:relative; padding:0; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .recipe-card:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(20,16,10,.14); }
  .recipe-card-img { width:100%; height:150px; background:var(--line); overflow:hidden; flex-shrink:0; }
  .recipe-card-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .recipe-card-body { padding:16px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .recipe-card h3 { margin:0 0 6px; font-size:17px; }
  .recipe-card .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
  .recipe-card ul { padding-left:18px; color:var(--muted); font-size:13px; margin:0 0 12px; }
  .card-cta { margin-top:auto; }
  .owner-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dark); background:var(--accent-soft); padding:2px 7px; border-radius:999px; margin-bottom:8px; }
  .category-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-dark); background:var(--gold-soft); padding:2px 7px; border-radius:999px; margin-bottom:8px; }
  .badge-row { display:flex; gap:6px; flex-wrap:wrap; }
  .badge-row > * { margin-bottom:0 !important; }
  .card-cta.added { background:var(--accent-soft); border-color:var(--accent-soft); color:var(--accent-dark); cursor:default; }
  .empty-state { color:var(--muted); padding:30px; text-align:center; }

  .item-menu-wrap { position:absolute; top:10px; right:10px; z-index:2; }
  .kebab-btn { width:28px; height:28px; border-radius:50%; border:0; background:rgba(255,255,255,.88); color:var(--on-light-chip); cursor:pointer; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 5px rgba(20,16,10,.18); }
  .kebab-btn:hover { background:#fff; }
  .item-menu { display:none; position:absolute; top:32px; right:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 18px rgba(20,16,10,.18); min-width:150px; padding:5px; z-index:5; }
  .item-menu.open { display:block; }
  .item-menu button { display:flex; align-items:center; gap:7px; width:100%; text-align:left; background:transparent; border:0; padding:8px 9px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--text); }
  .item-menu button:hover { background:var(--surface-2); }
  .item-menu button.danger { color:var(--rust); }
  .item-menu button.danger:hover { background:var(--rust-soft); }

  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(43,38,32,.4); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(720px,100%); max-height:90vh; overflow:auto; background:var(--surface); border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { margin-bottom:13px; }
  .field.full { grid-column:1 / -1; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input, .field textarea, .field select { width:100%; box-sizing:border-box; }
  .field textarea { min-height:90px; resize:vertical; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }

  .ing-rows { display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .ing-row { display:grid; grid-template-columns:90px 1fr 90px 32px; gap:8px; align-items:start; position:relative; }
  .ing-row input { width:100%; box-sizing:border-box; }
  .ing-row input.invalid { border-color:var(--rust); background:var(--rust-soft); }
  .ing-remove { border:0; background:transparent; color:var(--muted); font-size:18px; cursor:pointer; padding:4px; }
  .ing-remove:hover { color:var(--rust); }
  .ing-suggestions { position:absolute; top:100%; left:90px; right:122px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 18px rgba(20,16,10,.15); max-height:180px; overflow-y:auto; z-index:20; }
  .ing-suggestions div { padding:8px 10px; font-size:13px; cursor:pointer; }
  .ing-suggestions div:hover, .ing-suggestions div.active { background:var(--accent-soft); }
  .ing-suggestions .no-match { color:var(--muted); cursor:default; }
  .ing-suggestions .no-match:hover { background:none; }
  .add-row-btn { margin-top:2px; }
  .row-error { font-size:12px; color:var(--rust); margin-top:-4px; }

  @media(max-width:900px){ .recipe-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:650px){
    .recipe-grid{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
    .ing-row{grid-template-columns:70px 1fr 70px 28px}
    .ing-suggestions{left:70px; right:98px}
  }
</style>
</head>
<body>

<div class="section-head">
  <h2>Recipes</h2>
  <button class="btn primary" style="border-radius:999px;" onclick="openRecipeModal()">＋ Create new recipe</button>
</div>
<div class="action-row">
  <div class="recipe-tab-pill">
    <button class="active" id="tabMine" onclick="switchTab('mine')">My Recipes</button>
    <button id="tabLibrary" onclick="switchTab('library')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c2-1 5-1 7 0v14c-2-1-5-1-7 0V5Z"/><path d="M21 5c-2-1-5-1-7 0v14c2-1 5-1 7 0V5Z"/></svg>
      Library
    </button>
  </div>
  <div class="toolbar-row">
    <a class="icon-btn" href="recipes-import.html" id="importLink" style="display:none;" title="Bulk import" aria-label="Bulk import">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>
    </a>
    <button class="icon-btn" id="addAllBtn" onclick="addAllNewRecipes()" style="display:none;" title="Add all new recipes" aria-label="Add all new recipes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="1.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
    </button>
  </div>
</div>
<div class="recipe-toolbar">
  <input id="recipeSearch" placeholder="Search recipes…" oninput="renderRecipeList()">
  <select id="categoryFilter" onchange="renderRecipeList()" style="max-width:180px;">
    <option value="">All categories</option>
  </select>
</div>
<div id="recipeGrid" class="recipe-grid"></div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/recipes.js"></script>
</body>
</html>
