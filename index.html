<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .day { min-width:0; padding:14px; display:flex; flex-direction:column; }
  .day-head { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .day-name { font-weight:700; }
  .day-date { font-size:12px; color:var(--muted); margin-top:2px; }

  .item-row { display:flex; align-items:flex-start; gap:8px; padding:9px; margin-bottom:7px; border:1px solid var(--line); border-radius:10px; background:#fcfcfb; }
  .item-main { flex:1; min-width:0; }
  .tag-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dark); background:var(--accent-soft); padding:2px 7px; border-radius:999px; margin-bottom:4px; }
  .item-name { font-size:13px; font-weight:600; word-break:break-word; }
  .item-sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .remove-item { border:0; background:transparent; color:#aaa; font-size:16px; padding:0 2px; cursor:pointer; flex-shrink:0; }
  .remove-item:hover { color:#c0392b; }
  .no-items { color:var(--muted); font-size:12px; padding:8px 2px 4px; }
  .add-day-btn { margin-top:auto; width:100%; border:1px dashed #d1d2cc; background:transparent; border-radius:10px; padding:9px; color:#7a7c74; font-size:13px; cursor:pointer; }
  .add-day-btn:hover { background:#fcfcfb; }

  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.38); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:white; border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; margin-bottom:4px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }

  .type-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .type-btn { flex:1; border:1px solid var(--line); background:white; border-radius:10px; padding:10px; cursor:pointer; font-size:14px; }
  .type-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }

  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; background:white; box-sizing:border-box; }
  .tag-quantity-row { display:grid; grid-template-columns:2fr 1fr; gap:10px; }

  .add-options { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .add-option { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f0f0ed; }
  .add-option:last-child { border-bottom:0; }
  .add-option:hover { background:var(--accent-soft); }
  .add-option .sub { color:var(--muted); font-size:11px; margin-top:1px; }
  .add-options .empty-state { padding:16px; font-size:13px; }

  @media(max-width:900px){.week-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:650px){.week-grid{grid-template-columns:1fr}.tag-quantity-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="index.html" class="active">📅 Week</a>
    <a href="recipes.html">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="foods.html">🥫 Foods</a>
  </nav>
</header>

<main>
<section id="week" class="view active">
  <div class="section-head"><h2>This Week</h2><button class="btn primary" onclick="clearWeek()">Clear week</button></div>
  <div id="weekGrid" class="week-grid"></div>
</section>
</main>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<div id="dbStatus" class="status">Connecting to Supabase…</div>

<script src="js/supabase.js"></script>
<script>
// data.week is keyed by ISO date ("2026-08-31") -> an array of items.
// Each item: { id, tag, type: 'recipe'|'food', refId, quantity, name, sub }
const data = { recipes: [], foods: [], week: {} };
let currentMealPlanId = null;
let loading = false;

// Add-item modal state
let addModalIso = null;
let addModalDayName = null;
let addType = "recipe";

const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const tagOrder = ["Breakfast","Lunch","Dinner","Snack"];

function setDbStatus(message) {
  document.getElementById("dbStatus").textContent = message;
}

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getWeekDates() {
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);

  return dayNames.map((name, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return { dayName: name, iso: isoDate(d), display: d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) };
  });
}

function sortItems(items) {
  return [...items].sort((a, b) => {
    const ai = tagOrder.indexOf(a.tag), bi = tagOrder.indexOf(b.tag);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return 0; // both custom tags — keep insertion order
  });
}

// ---------- Loading ----------

async function loadAll() {
  if (loading) return;
  loading = true;
  try {
    setDbStatus("Loading…");
    const weekStart = getWeekDates()[0].iso;

    const [recipes, foods, plans] = await Promise.all([
      supabaseRequest("recipes", { query: "?select=id,name,cooking_time_minutes&order=name.asc" }),
      supabaseRequest("foods", { query: "?select=id,name,brand,serving_unit&order=name.asc" }),
      supabaseRequest("meal_plans", { query: `?select=id&week_start=eq.${weekStart}&user_id=is.null&limit=1` })
    ]);

    data.recipes = recipes;
    data.foods = foods;
    currentMealPlanId = plans.length ? plans[0].id : null;

    let rawItems = [];
    if (currentMealPlanId) {
      rawItems = await supabaseRequest("meal_plan_items", {
        query: `?select=id,day,meal_type,recipe_id,food_id,quantity&meal_plan_id=eq.${currentMealPlanId}`
      });
    }

    data.week = {};
    rawItems.forEach(raw => {
      let item;
      if (raw.recipe_id) {
        const recipe = data.recipes.find(r => r.id === raw.recipe_id);
        item = {
          id: raw.id, tag: raw.meal_type, type: "recipe", refId: raw.recipe_id,
          quantity: raw.quantity,
          name: recipe ? recipe.name : "(deleted recipe)",
          sub: recipe && recipe.cooking_time_minutes ? `${recipe.cooking_time_minutes} mins` : ""
        };
      } else if (raw.food_id) {
        const food = data.foods.find(f => f.id === raw.food_id);
        item = {
          id: raw.id, tag: raw.meal_type, type: "food", refId: raw.food_id,
          quantity: raw.quantity,
          name: food ? food.name : "(deleted food)",
          sub: food ? (food.brand || food.serving_unit || "") : ""
        };
      } else {
        return;
      }
      if (!data.week[raw.day]) data.week[raw.day] = [];
      data.week[raw.day].push(item);
    });

    renderWeek();
    setDbStatus("Connected to Supabase");
  } catch (error) {
    console.error(error);
    setDbStatus("Database connection failed");
  } finally {
    loading = false;
  }
}

// ---------- Rendering ----------

function renderWeek() {
  const weekDates = getWeekDates();
  document.getElementById("weekGrid").innerHTML = weekDates.map(({ dayName, iso, display }) => {
    const items = sortItems(data.week[iso] || []);
    return `<div class="card day">
      <div class="day-head"><div class="day-name">${dayName}</div><div class="day-date">${display}</div></div>
      ${items.length ? items.map(item => `
        <div class="item-row">
          <div class="item-main">
            ${item.tag ? `<div class="tag-badge">${esc(item.tag)}</div>` : ""}
            <div class="item-name">${item.type === "recipe" ? "🍳" : "🥫"} ${esc(item.name)}${item.quantity && item.quantity != 1 ? ` ×${esc(String(item.quantity))}` : ""}</div>
            ${item.sub ? `<div class="item-sub">${esc(item.sub)}</div>` : ""}
          </div>
          <button class="remove-item" onclick="removeItem('${item.id}')">×</button>
        </div>
      `).join("") : `<div class="no-items">Nothing planned yet.</div>`}
      <button class="add-day-btn" onclick="openAddModal('${iso}','${dayName}')">＋ Add</button>
    </div>`;
  }).join("");
}

// ---------- Add-item modal ----------

function openAddModal(iso, dayName) {
  addModalIso = iso;
  addModalDayName = dayName;
  addType = "recipe";

  document.getElementById("modal").innerHTML = `
    <h2>Add to ${dayName}</h2>
    <p class="meta">Pick a recipe or food, tag it, then choose it from the list below to add it.</p>

    <div class="type-toggle">
      <button type="button" class="type-btn active" id="typeBtnRecipe" onclick="switchAddType('recipe')">🍳 Recipe</button>
      <button type="button" class="type-btn" id="typeBtnFood" onclick="switchAddType('food')">🥫 Food</button>
    </div>

    <div class="tag-quantity-row">
      <div class="field">
        <label>Tag</label>
        <input id="addTag" list="tagOptions" placeholder="e.g. Breakfast">
        <datalist id="tagOptions">
          <option value="Breakfast"><option value="Lunch"><option value="Dinner"><option value="Snack">
        </datalist>
      </div>
      <div class="field">
        <label>Quantity</label>
        <input id="addQuantity" type="number" step="any" min="0" value="1">
      </div>
    </div>

    <div class="field">
      <label>Search</label>
      <input id="addSearch" placeholder="Type to search…" oninput="renderAddOptions()">
    </div>

    <div id="addOptions" class="add-options"></div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  `;

  renderAddOptions();
  document.getElementById("modalBackdrop").classList.add("open");
}

function switchAddType(type) {
  addType = type;
  document.getElementById("typeBtnRecipe").classList.toggle("active", type === "recipe");
  document.getElementById("typeBtnFood").classList.toggle("active", type === "food");
  document.getElementById("addSearch").value = "";
  renderAddOptions();
}

function renderAddOptions() {
  const term = document.getElementById("addSearch").value.trim().toLowerCase();
  const source = addType === "recipe" ? data.recipes : data.foods;

  const filtered = source.filter(x => x.name.toLowerCase().includes(term));
  const box = document.getElementById("addOptions");

  if (!filtered.length) {
    box.innerHTML = `<div class="empty-state">${source.length ? "No matches." : `No ${addType}s yet — add some on the ${addType === "recipe" ? "Recipes" : "Foods"} page.`}</div>`;
    return;
  }

  box.innerHTML = filtered.map(x => `
    <div class="add-option" onclick="confirmAddItem('${x.id}')">
      <div>${esc(x.name)}</div>
      <div class="sub">${addType === "recipe" ? (x.cooking_time_minutes ? x.cooking_time_minutes + " mins" : "") : (x.brand || x.serving_unit || "")}</div>
    </div>
  `).join("");
}

async function confirmAddItem(refId) {
  const tag = document.getElementById("addTag").value.trim() || "Meal";
  const quantityRaw = document.getElementById("addQuantity").value;
  const quantity = quantityRaw === "" ? 1 : Number(quantityRaw);

  try {
    const planId = await ensureMealPlan();
    const body = { meal_plan_id: planId, day: addModalIso, meal_type: tag, quantity };
    if (addType === "recipe") body.recipe_id = refId; else body.food_id = refId;

    await supabaseRequest("meal_plan_items", { method: "POST", body });
    closeModal();
    await loadAll();
  } catch (error) {
    console.error(error);
    alert("Couldn't add that to the plan. Check the browser console for details.");
  }
}

async function removeItem(itemId) {
  try {
    await supabaseRequest("meal_plan_items", {
      method: "DELETE",
      query: `?id=eq.${itemId}`,
      prefer: "return=minimal"
    });
    await loadAll();
  } catch (error) {
    console.error(error);
    alert("Couldn't remove that item. Check the browser console for details.");
  }
}

// ---------- Meal plan row (lazy-created) ----------

async function ensureMealPlan() {
  if (currentMealPlanId) return currentMealPlanId;

  const weekStart = getWeekDates()[0].iso;
  const existing = await supabaseRequest("meal_plans", {
    query: `?select=id&week_start=eq.${weekStart}&user_id=is.null&limit=1`
  });
  if (existing.length) {
    currentMealPlanId = existing[0].id;
    return currentMealPlanId;
  }

  const created = await supabaseRequest("meal_plans", {
    method: "POST",
    body: { week_start: weekStart, user_id: null }
  });
  currentMealPlanId = created[0].id;
  return currentMealPlanId;
}

async function clearWeek() {
  if (!confirm("Clear all items from this week?")) return;
  try {
    if (currentMealPlanId) {
      await supabaseRequest("meal_plans", {
        method: "DELETE",
        query: `?id=eq.${currentMealPlanId}`,
        prefer: "return=minimal"
      });
    }
    await loadAll();
  } catch (error) {
    console.error(error);
    alert("Couldn't clear the week. Check the browser console for details.");
  }
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

loadAll();
</script>
</body>
</html>
