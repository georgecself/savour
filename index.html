<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var pref = localStorage.getItem('savour_theme') || 'system';
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .week-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-items:start; }
  .day { min-width:0; padding:14px; display:flex; flex-direction:column; }
  .day-head { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .essentials-day .day-name { color:var(--accent-dark); }
  .essentials-day { background:var(--accent-soft); border-color:var(--accent-soft); }
  .day-name { font-weight:700; }
  .day-date { font-size:12px; color:var(--muted); margin-top:2px; }

  .item-row { position:relative; display:flex; align-items:flex-start; gap:9px; padding:10px; margin-bottom:8px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); }
  .item-thumb { width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0; margin-top:1px; }
  .item-thumb.cover-placeholder { display:flex; align-items:center; justify-content:center; background:var(--accent-soft); }
  .item-thumb.cover-placeholder svg { opacity:.6; }
  .item-main { flex:1; min-width:0; }
  .tag-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dark); background:var(--accent-soft); padding:2px 7px; border-radius:999px; margin-bottom:4px; cursor:pointer; }
  .tag-badge:hover { filter:brightness(0.95); }
  .item-name { font-size:13px; font-weight:600; word-break:break-word; }
  .item-sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .no-items { color:var(--muted); font-size:12px; padding:8px 2px 4px; }
  .add-day-btn { margin-top:auto; width:100%; border:1px dashed var(--line); background:transparent; border-radius:10px; padding:9px; color:var(--muted); font-size:13px; cursor:pointer; }
  .add-day-btn:hover { background:var(--surface-2); }
  .applied-note { color:var(--success); font-weight:600; margin-top:5px; }

  /* Hero-style cards for items with a cover photo (recipes only) */
  .item-hero { position:relative; border-radius:10px; margin-bottom:8px; min-height:104px; background-size:cover; background-position:center; display:flex; align-items:flex-end; text-decoration:none; color:inherit; cursor:pointer; }
  .item-hero::before { content:""; position:absolute; inset:0; border-radius:10px; background:linear-gradient(to top, rgba(20,16,10,.8) 0%, rgba(20,16,10,.3) 55%, rgba(20,16,10,0) 100%); }
  .hero-content { position:relative; z-index:1; padding:10px; width:100%; }
  .item-hero .tag-badge { background:rgba(255,255,255,.92); color:var(--on-light-chip); }
  .item-hero .item-name { color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.5); }
  .item-hero .item-sub { color:rgba(255,255,255,.9); text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .item-hero .applied-note { color:#baf0c2; }

  /* Shared kebab menu (both card styles) */
  .item-menu-wrap { position:relative; flex-shrink:0; }
  .item-hero .item-menu-wrap { position:absolute; top:8px; right:8px; z-index:2; }
  .kebab-btn { width:26px; height:26px; border-radius:50%; border:0; cursor:pointer; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .item-row .kebab-btn { background:transparent; color:var(--muted); }
  .item-row .kebab-btn:hover { background:var(--surface); color:var(--text); }
  .item-hero .kebab-btn { background:rgba(0,0,0,.4); color:#fff; }
  .item-hero .kebab-btn:hover { background:rgba(0,0,0,.6); }
  .item-menu { display:none; position:absolute; top:30px; right:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 18px rgba(43,38,32,.18); min-width:150px; padding:5px; z-index:5; }
  .item-menu.open { display:block; }
  .item-menu button { display:flex; align-items:center; gap:7px; width:100%; text-align:left; background:transparent; border:0; padding:8px 9px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--text); }
  .item-menu button:hover { background:var(--surface-2); }
  .item-menu button.danger { color:var(--rust); }
  .item-menu button.danger:hover { background:var(--rust-soft); }

  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(43,38,32,.4); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--surface); border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; margin-bottom:4px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }

  .type-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .type-btn { flex:1; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:10px; padding:10px; cursor:pointer; font-size:14px; }
  .type-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }
  .type-btn:disabled { opacity:.45; cursor:default; }

  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input, .field select { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); box-sizing:border-box; }
  .tag-quantity-row { display:grid; grid-template-columns:2fr 1fr; gap:10px; }

  .add-options { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .add-option { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .add-option:last-child { border-bottom:0; }
  .add-option:hover { background:var(--accent-soft); }
  .add-option .sub { color:var(--muted); font-size:11px; margin-top:1px; }
  .add-options .empty-state { padding:16px; font-size:13px; }

  .selection-banner { background:var(--accent-soft); color:var(--accent-dark); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .selection-banner button { border:0; background:transparent; color:var(--accent-dark); font-size:12px; text-decoration:underline; cursor:pointer; }

  .mark-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .mark-row:last-child { border-bottom:0; }
  .mark-row-name { flex:1; font-size:14px; }
  .mark-row input { width:90px; padding:8px; border:1px solid var(--line); border-radius:8px; text-align:right; }
  .mark-row-unit { width:50px; font-size:12px; color:var(--muted); }

  @media(max-width:900px){.week-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:650px){.week-grid{grid-template-columns:1fr}.tag-quantity-row{grid-template-columns:1fr}}

  /* Toolbar: icon-circle buttons + a segmented pill for week navigation */
  .toolbar-row { display:flex; align-items:center; gap:10px; }
  .icon-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--surface-2); border-color:var(--muted); }
  .icon-btn.danger:hover { background:var(--rust-soft); border-color:var(--rust); color:var(--rust); }

  .week-nav-pill { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); }
  .week-nav-pill button { border:0; background:transparent; color:var(--text); padding:9px 18px; cursor:pointer; font-size:14px; font-family:var(--font-body); position:relative; display:flex; align-items:center; }
  .week-nav-pill button:not(:last-child)::after { content:""; position:absolute; right:0; top:22%; bottom:22%; width:1px; background:var(--line); }
  .week-nav-pill button:hover { background:var(--surface-2); }

  @media print {
    .sidebar, .mobile-topbar, .status-dot-row, .week-toolbar, .add-day-btn, .item-menu-wrap { display:none !important; }
    body { background:#fff !important; }
    .app-main { padding:0 !important; }
    .week-grid { display:block !important; }
    .day { border:1px solid #ccc !important; background:#fff !important; box-shadow:none !important; break-inside:avoid; margin-bottom:14px; padding:12px; }
    .item-hero { background-image:none !important; background:#f4f4f2 !important; display:block !important; }
    .item-hero::before { display:none !important; }
    .item-hero .item-name, .item-hero .item-sub { color:#000 !important; text-shadow:none !important; }
    .item-row { background:#fff !important; border:1px solid #ddd !important; }
    .tag-badge, .item-hero .tag-badge { background:#eee !important; color:#000 !important; }
    .item-name, .item-sub, .item-name { color:#000 !important; }
  }
</style>
</head>
<body>

<section id="week" class="view active">
  <div class="section-head">
    <h2 id="weekHeading">This Week</h2>
    <div class="week-toolbar toolbar-row">
      <button class="icon-btn danger" onclick="clearWeek()" title="Clear week" aria-label="Clear week">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
      </button>
      <button class="icon-btn" onclick="downloadWeekAsPdf()" title="Download as PDF" aria-label="Download as PDF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="M6 10l6 6 6-6"/><path d="M4 20h16"/></svg>
      </button>
      <div class="week-nav-pill">
        <button onclick="navigateWeek(-1)" title="Previous week" aria-label="Previous week">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button onclick="jumpToToday()">Today</button>
        <button onclick="navigateWeek(1)" title="Next week" aria-label="Next week">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="weekGrid" class="week-grid"></div>
</section>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script>
// data.week is keyed by ISO date ("2026-08-31") -> an array of items.
// Each item: { id, tag, type: 'recipe'|'food', refId, name, sub,
//              quantity (foods only),
//              portionsMade (recipe "cook" entries only),
//              leftoverOf, portionsEaten (recipe "leftover" entries only),
//              pantryAppliedAt }
const data = { recipes: [], foods: [], week: {} };
let currentMealPlanId = null;
let loading = false;

function getMondayOf(date) {
  const day = date.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(date);
  monday.setDate(date.getDate() + diffToMonday);
  monday.setHours(0, 0, 0, 0);
  return monday;
}

let viewedMonday = getMondayOf(new Date()); // which week the planner is currently showing

// Add-item modal state
let addModalIso = null;
let addModalDayName = null;
let addType = "recipe";
let addCookMode = "fresh"; // "fresh" | "leftover" — recipes only
let pendingAddSelection = null; // { id, name, sub } once picked, before confirming
let pendingEligibleBatches = []; // fetched live, across ALL weeks, once a recipe is picked
let pendingRecipeFromLink = null; // recipe id passed in via ?addRecipe= from the recipe view page

// Mark-as-cooked/eaten modal state
let pendingMarkItemId = null;
let pendingMarkRows = null; // [{ ingredientId|foodId, name, unit, suggestedQty }]

const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const tagOrder = ["Breakfast","Lunch","Dinner","Snack"];
const ESSENTIALS_KEY = "essentials"; // data.week[ESSENTIALS_KEY] holds items with day = null

function setDbStatus(message) {
  const state = message === "Connected to Server" ? "ok" : message === "Database connection failed" ? "error" : undefined;
  setShellStatus(state, message);
}

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getWeekDates() {
  return dayNames.map((name, i) => {
    const d = new Date(viewedMonday);
    d.setDate(viewedMonday.getDate() + i);
    return { dayName: name, iso: isoDate(d), display: d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) };
  });
}

function formatDateLabel(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

function sortItems(items) {
  return [...items].sort((a, b) => {
    const ai = tagOrder.indexOf(a.tag), bi = tagOrder.indexOf(b.tag);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return 0; // both custom tags — keep insertion order
  });
}

function findItemById(itemId) {
  for (const iso in data.week) {
    const found = data.week[iso].find(i => i.id === itemId);
    if (found) return found;
  }
  return null;
}

function findIsoForItem(itemId) {
  for (const iso in data.week) {
    if (data.week[iso].some(i => i.id === itemId)) return iso;
  }
  return null;
}

// ---------- Loading ----------

async function loadAll() {
  if (loading) return;
  loading = true;
  try {
    setDbStatus("Loading…");
    const weekStart = getWeekDates()[0].iso;

    const [recipes, foods, ingredients, plans] = await Promise.all([
      supabaseRequest("recipes", { query: `?select=id,name,servings,cooking_time_minutes,image_url&user_id=eq.${window.currentUserId}&order=name.asc` }),
      supabaseRequest("foods", { query: `?select=id,name,brand,serving_unit,image_url&user_id=eq.${window.currentUserId}&order=name.asc` }),
      supabaseRequest("ingredients", { query: "?select=id,name,default_unit&order=name.asc" }),
      supabaseRequest("meal_plans", { query: `?select=id&week_start=eq.${weekStart}&user_id=eq.${window.currentUserId}&limit=1` })
    ]);

    data.recipes = recipes;
    data.foods = foods;
    data.ingredients = ingredients;
    currentMealPlanId = plans.length ? plans[0].id : null;

    let rawItems = [];
    if (currentMealPlanId) {
      rawItems = await supabaseRequest("meal_plan_items", {
        query: `?select=id,day,meal_type,recipe_id,food_id,ingredient_id,quantity,unit,portions_made,portions_eaten,leftover_of,pantry_applied_at&meal_plan_id=eq.${currentMealPlanId}`
      });
    }

    data.week = {};
    rawItems.forEach(raw => {
      let item;
      if (raw.recipe_id) {
        const recipe = data.recipes.find(r => r.id === raw.recipe_id);
        item = {
          id: raw.id, tag: raw.meal_type, type: "recipe", refId: raw.recipe_id,
          name: recipe ? recipe.name : "(deleted recipe)",
          imageUrl: recipe?.image_url || "",
          sub: recipe && recipe.cooking_time_minutes ? `${recipe.cooking_time_minutes} mins` : "",
          portionsMade: raw.portions_made,
          leftoverOf: raw.leftover_of,
          portionsEaten: raw.portions_eaten,
          pantryAppliedAt: raw.pantry_applied_at
        };
      } else if (raw.food_id) {
        const food = data.foods.find(f => f.id === raw.food_id);
        item = {
          id: raw.id, tag: raw.meal_type, type: "food", refId: raw.food_id,
          quantity: raw.quantity,
          name: food ? food.name : "(deleted food)",
          imageUrl: food?.image_url || "",
          sub: food ? (food.brand || food.serving_unit || "") : "",
          pantryAppliedAt: raw.pantry_applied_at
        };
      } else if (raw.ingredient_id) {
        const ingredient = data.ingredients.find(i => i.id === raw.ingredient_id);
        item = {
          id: raw.id, tag: raw.meal_type, type: "ingredient", refId: raw.ingredient_id,
          quantity: raw.quantity, unit: raw.unit,
          name: ingredient ? ingredient.name : "(deleted ingredient)",
          imageUrl: "", sub: ""
        };
      } else {
        return;
      }
      const dayKey = raw.day === null ? ESSENTIALS_KEY : raw.day;
      if (!data.week[dayKey]) data.week[dayKey] = [];
      data.week[dayKey].push(item);
    });

    await attachPortionsRemaining();

    renderWeek();
    setDbStatus("Connected to Server");
  } catch (error) {
    console.error(error);
    setDbStatus("Database connection failed");
  } finally {
    loading = false;
  }
}

// Fills in item.portionsRemaining for every cook entry currently in view, by
// checking claims against it across ALL weeks (not just this one).
async function attachPortionsRemaining() {
  const cookEntries = Object.values(data.week).flat().filter(i => i.type === "recipe" && !i.leftoverOf);
  if (!cookEntries.length) return;

  const idList = cookEntries.map(i => `"${i.id}"`).join(",");
  try {
    const claims = await supabaseRequest("meal_plan_items", {
      query: `?select=leftover_of,portions_eaten&leftover_of=in.(${idList})`
    });
    const eatenByBatch = {};
    claims.forEach(c => { eatenByBatch[c.leftover_of] = (eatenByBatch[c.leftover_of] || 0) + (c.portions_eaten || 0); });

    cookEntries.forEach(item => {
      const eatenTonight = item.portionsEaten || 0; // the cook-fresh entry now records its own night's consumption too
      item.portionsRemaining = (item.portionsMade || 0) - eatenTonight - (eatenByBatch[item.id] || 0);
    });
  } catch (error) {
    console.error(error); // non-critical — just skip showing the indicator
  }
}

// ---------- Rendering ----------

function renderWeek() {
  updateWeekHeading();
  const weekDates = getWeekDates();
  const isoToDay = Object.fromEntries(weekDates.map(d => [d.iso, d.dayName]));

  const dayCards = weekDates.map(({ dayName, iso, display }) => {
    const items = sortItems(data.week[iso] || []);
    return `<div class="card day">
      <div class="day-head"><div class="day-name">${dayName}</div><div class="day-date">${display}</div></div>
      ${items.length ? items.map(item => renderItemRow(item, isoToDay)).join("") : `<div class="no-items">Nothing planned yet.</div>`}
      <button class="add-day-btn" onclick="openAddModal('${iso}','${dayName}')">＋ Add</button>
    </div>`;
  }).join("");

  const essentialItems = data.week[ESSENTIALS_KEY] || [];
  const essentialsCard = `<div class="card day essentials-day">
    <div class="day-head"><div class="day-name">Essentials</div><div class="day-date">Not tied to a day</div></div>
    ${essentialItems.length ? essentialItems.map(item => renderEssentialItemRow(item)).join("") : `<div class="no-items">Nothing added yet.</div>`}
    <button class="add-day-btn" onclick="openEssentialsAddModal()">＋ Add</button>
  </div>`;

  document.getElementById("weekGrid").innerHTML = dayCards + essentialsCard;
}

function updateWeekHeading() {
  const weekDates = getWeekDates();
  const isCurrentWeek = isoDate(viewedMonday) === isoDate(getMondayOf(new Date()));
  const rangeLabel = `${weekDates[0].display} – ${weekDates[6].display}`;
  document.getElementById("weekHeading").textContent = isCurrentWeek ? `This Week (${rangeLabel})` : rangeLabel;
}

async function navigateWeek(delta) {
  viewedMonday.setDate(viewedMonday.getDate() + delta * 7);
  currentMealPlanId = null; // the previous week's plan id no longer applies
  await loadAll();
}

async function jumpToToday() {
  viewedMonday = getMondayOf(new Date());
  currentMealPlanId = null;
  await loadAll();
}

function renderItemRow(item, isoToDay) {
  const isLeftover = item.type === "recipe" && item.leftoverOf;
  let subLabel = item.sub;
  let qtyLabel = "";

  if (item.type === "recipe") {
    if (isLeftover) {
      const sourceIso = findIsoForItem(item.leftoverOf);
      const dayLabel = sourceIso ? isoToDay[sourceIso] : null;
      subLabel = `Leftovers${dayLabel ? " from " + dayLabel + "'s batch" : ""}`;
      qtyLabel = ` — ${item.portionsEaten || 1} portion${(item.portionsEaten || 1) == 1 ? "" : "s"}`;
    } else {
      qtyLabel = ` — makes ${item.portionsMade || "?"} portions`;
      if (item.portionsRemaining !== undefined && item.portionsRemaining < (item.portionsMade || 0)) {
        qtyLabel += ` · ${Math.max(0, item.portionsRemaining)} left`;
      }
    }
  } else if (item.quantity && item.quantity != 1) {
    qtyLabel = ` ×${item.quantity}`;
  }

  const showMarkAction = !isLeftover; // leftovers don't trigger a new pantry deduction
  const markLabel = item.type === "recipe" ? "cooked" : "eaten";
  const menuHtml = renderItemMenu(item, showMarkAction, markLabel);

  // Foods no longer carry a photo, so only a recipe cook/leftover entry with
  // an image gets the full hero treatment — everything else stays compact.
  if (item.imageUrl) {
    return `
      <a href="recipe-view.html?id=${item.refId}" class="item-hero" style="background-image:url('${esc(item.imageUrl)}')">
        ${menuHtml}
        <div class="hero-content">
          <div class="tag-badge" title="Click to edit" onclick="event.stopPropagation(); event.preventDefault(); openEditModal('${item.id}')">${esc(item.tag || "Meal")}</div>
          <div class="item-name">${esc(item.name)}${qtyLabel}</div>
          ${subLabel ? `<div class="item-sub">${esc(subLabel)}</div>` : ""}
          ${showMarkAction && item.pantryAppliedAt ? `<div class="item-sub applied-note">✓ Marked ${markLabel}</div>` : ""}
        </div>
      </a>
    `;
  }

async function fetchEligibleBatches(recipeId, uptoIso) {
  // Cross-week: search all of the user's recent cook entries for this recipe,
  // not just whatever week is currently on screen. Restricted to batches on
  // or before the day being planned — you can't eat leftovers of something
  // that hasn't been cooked yet.
  const plans = await supabaseRequest("meal_plans", {
    query: `?select=id&user_id=eq.${window.currentUserId}&order=week_start.desc&limit=8`
  });
  if (!plans.length) return [];

  const planIds = plans.map(p => `"${p.id}"`).join(",");
  const items = await supabaseRequest("meal_plan_items", {
    query: `?select=id,day,portions_made,portions_eaten&recipe_id=eq.${recipeId}&leftover_of=is.null&meal_plan_id=in.(${planIds})&day=lte.${uptoIso}&order=day.desc&limit=15`
  });
  if (!items.length) return [];

  // Work out how many portions are already claimed against each candidate
  // batch, so fully-used-up batches don't show as an option at all.
  const itemIds = items.map(i => `"${i.id}"`).join(",");
  const claims = await supabaseRequest("meal_plan_items", {
    query: `?select=leftover_of,portions_eaten&leftover_of=in.(${itemIds})`
  });
  const eatenByBatch = {};
  claims.forEach(c => { eatenByBatch[c.leftover_of] = (eatenByBatch[c.leftover_of] || 0) + (c.portions_eaten || 0); });

  return items
    .map(i => {
      const made = i.portions_made || 0;
      const eatenTonight = i.portions_eaten || 0; // the cook-fresh entry's own night-of consumption
      const remaining = made - eatenTonight - (eatenByBatch[i.id] || 0);
      return { id: i.id, made, remaining };
    })
    .filter(b => b.remaining > 0)
    .map(b => ({ id: b.id, remaining: b.remaining, label: `${formatDateLabel(items.find(i => i.id === b.id).day)} — ${b.remaining} portion${b.remaining === 1 ? "" : "s"} left (of ${b.made} made)` }));
}

async function selectAddItem(refId) {
  const source = addType === "recipe" ? data.recipes : data.foods;
  const item = source.find(x => x.id === refId);
  if (!item) return;

  addCookMode = "fresh";
  pendingAddSelection = {
    id: item.id,
    name: item.name,
    imageUrl: item.image_url || "",
    sub: addType === "recipe"
      ? (item.cooking_time_minutes ? `${item.cooking_time_minutes} mins` : "")
      : (item.brand || item.serving_unit || "")
  };
  pendingEligibleBatches = [];

  if (addType === "recipe") {
    document.getElementById("modal").innerHTML = `<h2>Loading…</h2>`;
    try {
      pendingEligibleBatches = await fetchEligibleBatches(item.id, addModalIso);
    } catch (error) {
      console.error(error);
      pendingEligibleBatches = [];
    }
  }

  renderAddModal();
}

async function confirmAddItem() {
  const tag = document.getElementById("addTag").value.trim() || "Meal";
  const sel = pendingAddSelection;
  const isRecipe = addType === "recipe";
  const isLeftover = isRecipe && addCookMode === "leftover";

  const body = { day: addModalIso, meal_type: tag };
  const localItem = { id: null, tag, type: addType, refId: sel.id, name: sel.name, imageUrl: sel.imageUrl, sub: sel.sub, pantryAppliedAt: null };

  if (isRecipe) {
    body.recipe_id = sel.id;
    if (isLeftover) {
      const leftoverOfId = document.getElementById("addLeftoverOf").value;
      const portionsEaten = Number(document.getElementById("addQuantity").value) || 1;
      const batch = pendingEligibleBatches.find(b => b.id === leftoverOfId);
      if (batch && portionsEaten > batch.remaining) {
        alert(`Only ${batch.remaining} portion${batch.remaining === 1 ? "" : "s"} left from that batch.`);
        return;
      }
      body.leftover_of = leftoverOfId;
      body.portions_eaten = portionsEaten;
      localItem.leftoverOf = leftoverOfId;
      localItem.portionsEaten = portionsEaten;
    } else {
      const portionsMade = Number(document.getElementById("addQuantity").value) || 1;
      const servingsTonightRaw = document.getElementById("addServingsTonight").value;
      const servingsTonight = servingsTonightRaw === "" ? 1 : Number(servingsTonightRaw);
      if (servingsTonight > portionsMade) {
        alert(`You can't eat more than the ${portionsMade} portion${portionsMade === 1 ? "" : "s"} you're making.`);
        return;
      }
      body.portions_made = portionsMade;
      body.portions_eaten = servingsTonight;
      localItem.portionsMade = portionsMade;
      localItem.portionsEaten = servingsTonight;
    }
  } else {
    body.food_id = sel.id;
    const quantity = Number(document.getElementById("addQuantity").value) || 1;
    body.quantity = quantity;
    localItem.quantity = quantity;
  }

  try {
    const planId = await ensureMealPlan();
    body.meal_plan_id = planId;
    const created = await supabaseRequest("meal_plan_items", { method: "POST", body });
    localItem.id = created[0].id;

    if (!data.week[addModalIso]) data.week[addModalIso] = [];
    data.week[addModalIso].push(localItem);

    closeModal();
    renderWeek();
  } catch (error) {
    console.error(error);
    alert("Couldn't add that to the plan. Check the browser console for details.");
  }
}

function openEditModal(itemId) {

  if (!item) return;

  const isLeftover = item.type === "recipe" && item.leftoverOf;

  let qtyLabel = "Quantity";
  let qtyValue = item.quantity ?? 1;
  if (isRecipeCook) { qtyLabel = "Portions this makes"; qtyValue = item.portionsMade ?? 1; }
  if (isLeftover) { qtyLabel = "Portions eaten"; qtyValue = item.portionsEaten ?? 1; }

  document.getElementById("modal").innerHTML = `
    <h2>Edit ${esc(item.name)}</h2>
    <p class="meta">Change the tag or amount — to swap the recipe/food itself, remove this and add a new one.</p>

    <div class="tag-quantity-row">
      <div class="field">
        <label>Tag</label>
        <input id="editTag" list="tagOptions" value="${esc(item.tag || "")}" placeholder="e.g. Breakfast">
        <datalist id="tagOptions">
          <option value="Breakfast"><option value="Lunch"><option value="Dinner"><option value="Snack">
        </datalist>
      </div>
      <div class="field">
        <label>${qtyLabel}</label>
        <input id="editQuantity" type="number" step="any" min="0" value="${qtyValue}" ${isRecipeCook ? `oninput="onEditPortionsMadeInput()"` : ""}>
      </div>
    </div>

    ${isRecipeCook ? `
      <div class="field">
        <label>Servings you'll eat tonight</label>
        <input id="editServingsTonight" type="number" step="any" min="0" max="${qtyValue}" value="${item.portionsEaten ?? 1}">
      </div>
    ` : ""}

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveEditItem('${itemId}')">Save</button>
    </div>
  `;
  document.getElementById("modalBackdrop").classList.add("open");
}

function onEditPortionsMadeInput() {
  const madeInput = document.getElementById("editQuantity");
  const tonightInput = document.getElementById("editServingsTonight");
  if (!tonightInput) return;
  const made = Number(madeInput.value) || 0;
  tonightInput.max = made;
  if (Number(tonightInput.value) > made) tonightInput.value = made;
}

async function saveEditItem(itemId) {
  const item = findItemById(itemId);
  if (!item) return;

  const isLeftover = item.type === "recipe" && item.leftoverOf;
  const isRecipeCook = item.type === "recipe" && !item.leftoverOf;

  const tag = document.getElementById("editTag").value.trim() || "Meal";
  const qtyRaw = document.getElementById("editQuantity").value;
  const qty = qtyRaw === "" ? 1 : Number(qtyRaw);

  const body = { meal_type: tag };
  let servingsTonight = null;

  if (isRecipeCook) {
    const servingsTonightRaw = document.getElementById("editServingsTonight").value;
    servingsTonight = servingsTonightRaw === "" ? 1 : Number(servingsTonightRaw);

    if (servingsTonight > qty) {
      alert(`You can't eat more than the ${qty} portion${qty === 1 ? "" : "s"} you're making.`);
      return;
    }

    // Check against portions already claimed by leftover entries elsewhere
    // in the plan — increasing tonight's serving (or reducing portions
    // made) can otherwise overcommit a batch that's already spoken for.
    try {
      const claims = await supabaseRequest("meal_plan_items", {
        query: `?select=portions_eaten&leftover_of=eq.${itemId}`
      });
      const claimedByLeftovers = claims.reduce((sum, c) => sum + (c.portions_eaten || 0), 0);

      if (servingsTonight + claimedByLeftovers > qty) {
        const available = Math.max(0, qty - claimedByLeftovers);
        alert(
          `You've already planned ${claimedByLeftovers} leftover portion${claimedByLeftovers === 1 ? "" : "s"} from this batch elsewhere this week.\n\n` +
          `Eating ${servingsTonight} tonight would need ${servingsTonight + claimedByLeftovers} portions in total, but you're only making ${qty}.\n\n` +
          `Most you can eat tonight without changing those leftover entries: ${available}.`
        );
        return;
      }
    } catch (error) {
      console.error(error);
      // If this check itself fails, don't block the save entirely — a
      // permanently-stuck edit is worse than skipping one validation pass.
    }

    body.portions_made = qty;
    body.portions_eaten = servingsTonight;
  }
  else if (isLeftover) body.portions_eaten = qty;
  else body.quantity = qty;

  try {
    await supabaseRequest("meal_plan_items", { method: "PATCH", query: `?id=eq.${itemId}`, body });

    item.tag = tag;
    if (isRecipeCook) { item.portionsMade = qty; item.portionsEaten = servingsTonight; }
    else if (isLeftover) item.portionsEaten = qty;
    else item.quantity = qty;

    closeModal();
    renderWeek();
  } catch (error) {
    console.error(error);
    alert("Couldn't save that change. Check the browser console for details.");
  }
}

async function removeItem(itemId) {
  // Warn if entries anywhere (any week) reference this as their batch —
  // deleting it will detach them (the DB does this via ON DELETE SET NULL).
  const item = findItemById(itemId);
  let dependentCount = 0;

  if (item && item.type === "recipe" && !item.leftoverOf) {
    try {
      const dependents = await supabaseRequest("meal_plan_items", { query: `?select=id&leftover_of=eq.${itemId}` });
      dependentCount = dependents.length;
    } catch (error) {
      console.error(error);
    }
  }

  if (dependentCount) {
    const proceed = confirm(`This has ${dependentCount} leftover ${dependentCount === 1 ? "entry" : "entries"} linked to it (possibly in other weeks). Removing it will detach ${dependentCount === 1 ? "that entry" : "those entries"} from the batch. Continue?`);
    if (!proceed) return;
  }

  // Only entries loaded in the CURRENTLY VIEWED week can be patched locally —
  // any in other weeks will already be correct in the database and will
  // simply reflect that next time that week is opened.
  const localDependents = [];
  Object.values(data.week).forEach(items => {
    items.forEach(i => { if (i.leftoverOf === itemId) localDependents.push(i); });
  });

  try {
    await supabaseRequest("meal_plan_items", {
      method: "DELETE",
      query: `?id=eq.${itemId}`,
      prefer: "return=minimal"
    });

    localDependents.forEach(d => { d.leftoverOf = null; });

    for (const iso in data.week) {
      const idx = data.week[iso].findIndex(i => i.id === itemId);
      if (idx !== -1) { data.week[iso].splice(idx, 1); break; }
    }
    renderWeek();
  } catch (error) {
    console.error(error);
    alert("Couldn't remove that item. Check the browser console for details.");
  }
}

// ---------- Mark as cooked / eaten — deducts from pantry ----------

async function openMarkCookedModal(itemId) {
  const item = findItemById(itemId);
  if (!item) return;

  pendingMarkItemId = itemId;
  document.getElementById("modal").innerHTML = `<h2>Loading…</h2>`;
  document.getElementById("modalBackdrop").classList.add("open");

  try {
    const recipe = data.recipes.find(r => r.id === item.refId);
    const baseServings = recipe?.servings || 1;
    const multiplier = (item.portionsMade || baseServings) / baseServings;

    const rows = await supabaseRequest("recipe_ingredients", {
      query: `?select=ingredient_id,quantity,unit,ingredients(id,name,default_unit)&recipe_id=eq.${item.refId}&order=sort_order.asc`
    });

    pendingMarkRows = rows.filter(r => r.ingredients).map(r => ({
      ingredientId: r.ingredient_id,
      name: r.ingredients.name,
      unit: r.unit || r.ingredients.default_unit || "",
      suggestedQty: r.quantity !== null ? Math.round(r.quantity * multiplier * 100) / 100 : null
    }));

    renderMarkModal(item.name, "cooked");
  } catch (error) {
    console.error(error);
    alert("Couldn't load this recipe's ingredients. Check the browser console for details.");
    closeModal();
  }
}

function openMarkEatenModal(itemId) {
  const item = findItemById(itemId);
  if (!item) return;

  const food = data.foods.find(f => f.id === item.refId);
  pendingMarkItemId = itemId;
  pendingMarkRows = [{
    foodId: item.refId,
    name: food ? food.name : item.name,
    unit: food?.serving_unit || "",
    suggestedQty: item.quantity || 1
  }];

  renderMarkModal(item.name, "eaten");
  document.getElementById("modalBackdrop").classList.add("open");
}

function renderMarkModal(name, verb) {
  document.getElementById("modal").innerHTML = `
    <h2>Mark "${esc(name)}" as ${verb}</h2>
    <p class="meta">This will be subtracted from your pantry. Adjust any amounts first — anything you don't actually have tracked in your pantry is skipped automatically.</p>
    <div>
      ${pendingMarkRows.map((r, i) => `
        <div class="mark-row">
          <div class="mark-row-name">${esc(r.name)}</div>
          <input type="number" step="any" min="0" id="markQty_${i}" value="${r.suggestedQty ?? ""}" placeholder="0">
          <div class="mark-row-unit">${esc(r.unit)}</div>
        </div>
      `).join("")}
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="confirmMarkApplied()">Confirm — update pantry</button>
    </div>
  `;
}

async function deductFromPantry({ ingredientId, foodId, unit }, qty) {
  if (!qty || qty <= 0) return;

  const filters = ingredientId
    ? `ingredient_id=eq.${ingredientId}&${unit ? `unit=eq.${encodeURIComponent(unit)}` : "unit=is.null"}`
    : `food_id=eq.${foodId}`;

  const existing = await supabaseRequest("pantry_items", {
    query: `?select=id,quantity&${filters}&user_id=eq.${window.currentUserId}&limit=1`
  });

  if (!existing.length) return; // nothing tracked for this — nothing to subtract

  const newQty = Math.max(0, (existing[0].quantity || 0) - qty);
  await supabaseRequest("pantry_items", { method: "PATCH", query: `?id=eq.${existing[0].id}`, body: { quantity: newQty } });
}

async function confirmMarkApplied() {
  const itemId = pendingMarkItemId;
  const rows = pendingMarkRows.map((r, i) => ({
    ...r,
    enteredQty: document.getElementById(`markQty_${i}`).value
  }));

  try {
    for (const r of rows) {
      const qty = r.enteredQty === "" ? 0 : Number(r.enteredQty);
      await deductFromPantry({ ingredientId: r.ingredientId, foodId: r.foodId, unit: r.unit }, qty);
    }

    const appliedAt = new Date().toISOString();
    await supabaseRequest("meal_plan_items", { method: "PATCH", query: `?id=eq.${itemId}`, body: { pantry_applied_at: appliedAt } });

    const item = findItemById(itemId);
    if (item) item.pantryAppliedAt = appliedAt;

    closeModal();
    renderWeek();
  } catch (error) {
    console.error(error);
    alert("Couldn't update your pantry. Check the browser console for details.");
  }
}

// ---------- Meal plan row (lazy-created) ----------

async function ensureMealPlan() {
  if (currentMealPlanId) return currentMealPlanId;

  const weekStart = getWeekDates()[0].iso;
  const existing = await supabaseRequest("meal_plans", {
    query: `?select=id&week_start=eq.${weekStart}&user_id=eq.${window.currentUserId}&limit=1`
  });
  if (existing.length) {
    currentMealPlanId = existing[0].id;
    return currentMealPlanId;
  }

  const created = await supabaseRequest("meal_plans", {
    method: "POST",
    body: { week_start: weekStart, user_id: window.currentUserId }
  });
  currentMealPlanId = created[0].id;
  return currentMealPlanId;
}

async function clearWeek() {
  if (!confirm("Clear all items from this week?")) return;
  try {
    if (currentMealPlanId) {
      await supabaseRequest("meal_plans", {
        method: "DELETE",
        query: `?id=eq.${currentMealPlanId}`,
        prefer: "return=minimal"
      });
    }
    currentMealPlanId = null;
    data.week = {};
    renderWeek();
  } catch (error) {
    console.error(error);
    alert("Couldn't clear the week. Check the browser console for details.");
  }
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

function downloadWeekAsPdf() {
  const weekDates = getWeekDates();
  const heading = document.getElementById("weekHeading").textContent.trim();

  const dayBlocks = weekDates.map(({ dayName, iso, display }) => {
    const items = sortItems(data.week[iso] || []);
    const itemsHtml = items.length
      ? items.map(item => {
          let detail = "";
          if (item.type === "recipe") {
            detail = item.leftoverOf
              ? `${item.portionsEaten || 1} portion${(item.portionsEaten || 1) == 1 ? "" : "s"} (leftovers)`
              : `makes ${item.portionsMade || "?"} portions`;
          } else if (item.quantity && item.quantity != 1) {
            detail = `×${item.quantity}`;
          }
          return `<div class="p-item"><span class="p-tag">${esc(item.tag || "Meal")}</span><span class="p-name">${esc(item.name)}</span>${detail ? `<span class="p-detail"> — ${esc(detail)}</span>` : ""}</div>`;
        }).join("")
      : `<div class="p-empty">—</div>`;
    return `<div class="p-day"><div class="p-day-head">${esc(dayName)}<span class="p-day-date">${esc(display)}</span></div>${itemsHtml}</div>`;
  }).join("");

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(heading)}</title>
<style>
  @page { size: landscape; margin: 10mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 16px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .p-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .p-day { border: 1px solid #ccc; border-radius: 6px; padding: 7px; min-height: 90px; }
  .p-day-head { font-weight: bold; font-size: 11px; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 5px; }
  .p-day-date { font-weight: normal; color: #777; margin-left: 4px; font-size: 10px; }
  .p-item { font-size: 9.5px; margin-bottom: 5px; line-height: 1.3; }
  .p-tag { display: block; font-size: 8px; text-transform: uppercase; letter-spacing: .03em; color: #666; }
  .p-name { font-weight: 600; }
  .p-detail { color: #666; }
  .p-empty { font-size: 10px; color: #aaa; }
</style>
</head><body>
<h1>${esc(heading)}</h1>
<div class="p-grid">${dayBlocks}</div>
<script>
  window.onload = function () { setTimeout(function () { window.print(); }, 150); };
  window.onafterprint = function () { window.close(); };
<\/script>
</body></html>`;

  const printWindow = window.open("", "_blank");
  if (!printWindow) {
    alert("Your browser blocked the new tab needed for this — please allow pop-ups for this site and try again.");
    return;
  }
  printWindow.document.write(html);
  printWindow.document.close();
}

(async function init() {
  const uid = await window.authReady;
  if (!uid) return; // redirecting to login
  const params = new URLSearchParams(window.location.search);
  const weekParam = params.get("week");
  if (weekParam && /^\d{4}-\d{2}-\d{2}$/.test(weekParam)) {
    const [y, m, d] = weekParam.split("-").map(Number);
    viewedMonday = getMondayOf(new Date(y, m - 1, d));
  }
  await loadAll();

  const addRecipeParam = params.get("addRecipe");
  if (addRecipeParam) {
    const recipe = data.recipes.find(r => r.id === addRecipeParam);
    if (recipe) {
      pendingRecipeFromLink = addRecipeParam;
      showPendingRecipeBanner(recipe.name);
    }
  }
})();
</script>
