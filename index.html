<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .day { min-width:0; padding:14px; }
  .day-head { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .day-name { font-weight:700; }
  .day-date { font-size:12px; color:var(--muted); margin-top:2px; }
  .meal-slot { border:1px dashed #d1d2cc; border-radius:12px; padding:10px; margin-bottom:9px; min-height:68px; background:#fcfcfb; }
  .meal-slot.empty { color:#999b94; font-size:13px; display:flex; align-items:center; justify-content:center; text-align:center; width:100%; }
  .slot-label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:5px; }
  .meal-name { font-size:13px; font-weight:600; }
  .remove-meal { border:0; background:transparent; color:#aaa; float:right; padding:0 2px; }
  .meal-picker { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .meal-picker button { border:1px solid var(--line); background:white; border-radius:10px; padding:12px 8px; }
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.38); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(620px,100%); max-height:90vh; overflow:auto; background:white; border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
  .empty-state { color:var(--muted); padding:30px; text-align:center; }
  @media(max-width:900px){.week-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:650px){.week-grid{grid-template-columns:1fr}.meal-picker{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="index.html" class="active">📅 Week</a>
    <a href="recipes.html">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="foods.html">🥫 Foods</a>
  </nav>
</header>

<main>
<section id="week" class="view active">
  <div class="section-head"><h2>This Week</h2><button class="btn primary" onclick="clearWeek()">Clear week</button></div>
  <div id="weekGrid" class="week-grid"></div>
</section>
</main>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<div id="dbStatus" class="status">Connecting to Supabase…</div>

<script src="js/supabase.js"></script>
<script>
// data.week is keyed by ISO date string ("2026-08-31"), matching the `day`
// column on meal_plan_items, not by day name.
const data = { recipes: [], week: {} };
let currentMealPlanId = null; // null until this week's meal_plans row exists
let loading = false;

const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const mealTypes = ["Breakfast","Lunch","Dinner"];

function setDbStatus(message) {
  document.getElementById("dbStatus").textContent = message;
}

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Returns the 7 dates (Mon–Sun) of the current calendar week.
function getWeekDates() {
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);

  return dayNames.map((name, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return { dayName: name, iso: isoDate(d), display: d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) };
  });
}

async function loadAll() {
  if (loading) return;
  loading = true;
  try {
    setDbStatus("Loading…");
    const weekDates = getWeekDates();
    const weekStart = weekDates[0].iso;

    const [recipes, plans] = await Promise.all([
      supabaseRequest("recipes", { query: "?select=id,name,cooking_time_minutes&order=name.asc" }),
      supabaseRequest("meal_plans", { query: `?select=id&week_start=eq.${weekStart}&user_id=is.null&limit=1` })
    ]);

    data.recipes = recipes;
    currentMealPlanId = plans.length ? plans[0].id : null;

    let items = [];
    if (currentMealPlanId) {
      items = await supabaseRequest("meal_plan_items", {
        query: `?select=day,meal_type,recipe_id&meal_plan_id=eq.${currentMealPlanId}&recipe_id=not.is.null`
      });
    }

    data.week = {};
    items.forEach(item => {
      if (!data.week[item.day]) data.week[item.day] = {};
      data.week[item.day][item.meal_type] = item.recipe_id;
    });

    renderWeek();
    setDbStatus("Connected to Supabase");
  } catch (error) {
    console.error(error);
    setDbStatus("Database connection failed");
  } finally {
    loading = false;
  }
}

function renderWeek() {
  const weekDates = getWeekDates();
  document.getElementById("weekGrid").innerHTML = weekDates.map(({ dayName, iso, display }) => {
    const meals = data.week[iso] || {};
    return `<div class="card day">
      <div class="day-head"><div class="day-name">${dayName}</div><div class="day-date">${display}</div></div>
      ${mealTypes.map(type => {
        const recipe = data.recipes.find(r => r.id === meals[type]);
        return recipe
          ? `<div class="meal-slot"><button class="remove-meal" onclick="removeMeal('${iso}','${type}')">×</button><div class="slot-label">${type}</div><div class="meal-name">${esc(recipe.name)}</div></div>`
          : `<button class="meal-slot empty" onclick="openMealPicker('${iso}','${type}','${dayName}')"><span>＋ ${type}</span></button>`;
      }).join("")}
    </div>`;
  }).join("");
}

function openMealPicker(iso, type, dayName) {
  document.getElementById("modal").innerHTML = `<h2>Add ${type}</h2><p class="meta">${dayName}</p><div class="meal-picker">${
    data.recipes.map(r => `<button onclick="chooseMeal('${iso}','${type}','${r.id}')">${esc(r.name)}<br><small>${r.cooking_time_minutes || "?"} mins</small></button>`).join("")
    || "<p>No recipes yet — add some on the Recipes page.</p>"
  }</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById("modalBackdrop").classList.add("open");
}

// Finds this week's meal_plans row, or creates it the first time it's needed.
async function ensureMealPlan() {
  if (currentMealPlanId) return currentMealPlanId;

  const weekStart = getWeekDates()[0].iso;

  // Guard against a plan having been created by another tab/request in the meantime.
  const existing = await supabaseRequest("meal_plans", {
    query: `?select=id&week_start=eq.${weekStart}&user_id=is.null&limit=1`
  });
  if (existing.length) {
    currentMealPlanId = existing[0].id;
    return currentMealPlanId;
  }

  const created = await supabaseRequest("meal_plans", {
    method: "POST",
    body: { week_start: weekStart, user_id: null }
  });
  currentMealPlanId = created[0].id;
  return currentMealPlanId;
}

async function chooseMeal(iso, type, recipeId) {
  closeModal();
  try {
    const planId = await ensureMealPlan();
    // A slot holds at most one item, so clear anything already there first.
    await supabaseRequest("meal_plan_items", {
      method: "DELETE",
      query: `?meal_plan_id=eq.${planId}&day=eq.${iso}&meal_type=eq.${type}`,
      prefer: "return=minimal"
    });
    await supabaseRequest("meal_plan_items", {
      method: "POST",
      body: { meal_plan_id: planId, day: iso, meal_type: type, recipe_id: recipeId, quantity: 1 }
    });
    await loadAll();
  } catch (error) {
    console.error(error);
    alert("Couldn't save that to the plan. Check the browser console for details.");
    await loadAll(); // resync with whatever the database actually has
  }
}

async function removeMeal(iso, type) {
  if (!currentMealPlanId) return;
  try {
    await supabaseRequest("meal_plan_items", {
      method: "DELETE",
      query: `?meal_plan_id=eq.${currentMealPlanId}&day=eq.${iso}&meal_type=eq.${type}`,
      prefer: "return=minimal"
    });
    await loadAll();
  } catch (error) {
    console.error(error);
    alert("Couldn't remove that meal. Check the browser console for details.");
  }
}

async function clearWeek() {
  if (!confirm("Clear all meals from this week?")) return;
  try {
    if (currentMealPlanId) {
      // Deleting the meal_plans row cascades to delete its meal_plan_items too.
      await supabaseRequest("meal_plans", {
        method: "DELETE",
        query: `?id=eq.${currentMealPlanId}`,
        prefer: "return=minimal"
      });
    }
    await loadAll();
  } catch (error) {
    console.error(error);
    alert("Couldn't clear the week. Check the browser console for details.");
  }
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

loadAll();
</script>
</body>
</html>
