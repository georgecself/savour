<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .view { display:none; }
  .view.active { display:block; }
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .day { min-width:0; padding:14px; }
  .day-head { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .day-name { font-weight:700; }
  .day-date { font-size:12px; color:var(--muted); margin-top:2px; }
  .meal-slot { border:1px dashed #d1d2cc; border-radius:12px; padding:10px; margin-bottom:9px; min-height:68px; background:#fcfcfb; }
  .meal-slot.empty { color:#999b94; font-size:13px; display:flex; align-items:center; justify-content:center; text-align:center; width:100%; }
  .slot-label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:5px; }
  .meal-name { font-size:13px; font-weight:600; }
  .remove-meal { border:0; background:transparent; color:#aaa; float:right; padding:0 2px; }
  .recipe-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .recipe-card { padding:18px; }
  .recipe-card h3 { margin:0 0 6px; }
  .recipe-card ul { padding-left:18px; color:#4f514c; font-size:13px; }
  .recipe-actions { display:flex; gap:7px; margin-top:15px; }
  .meta { color:var(--muted); font-size:13px; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; margin:12px 0; }
  .tag { background:var(--accent-soft); color:var(--accent-dark); padding:4px 8px; border-radius:999px; font-size:11px; }
  .shopping-layout { display:grid; grid-template-columns:1fr 330px; gap:18px; }
  .shopping-card { padding:20px; }
  .category { margin-bottom:20px; }
  .category h3 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 8px; }
  .shop-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f0f0ed; }
  .shop-item input { width:17px; height:17px; accent-color:var(--accent); }
  .shop-item.checked span { text-decoration:line-through; color:#aaa; }
  .pantry-list { padding:18px; }
  .pantry-row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:10px 0; }
  .add-row { display:flex; gap:8px; margin-bottom:15px; }
  .add-row input { flex:1; border:1px solid var(--line); border-radius:10px; padding:10px; }
  .meal-picker { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .meal-picker button { border:1px solid var(--line); background:white; border-radius:10px; padding:12px 8px; }
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.38); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(620px,100%); max-height:90vh; overflow:auto; background:white; border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { margin-bottom:13px; }
  .field.full { grid-column:1 / -1; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input,.field textarea,.field select { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; background:white; }
  .field textarea { min-height:110px; resize:vertical; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
  @media(max-width:900px){.week-grid{grid-template-columns:repeat(4,1fr)}.recipe-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:650px){.week-grid{grid-template-columns:1fr}.recipe-grid,.shopping-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.meal-picker{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="#" class="active" data-view="week">📅 Week</a>
    <a href="#" data-view="recipes">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="#" data-view="shopping">🛒 Shopping</a>
    <a href="#" data-view="pantry">📦 Pantry</a>
  </nav>
</header>

<main>
<section id="week" class="view active">
  <div class="section-head"><h2>This Week</h2><button class="btn primary" onclick="clearWeek()">Clear week</button></div>
  <div id="weekGrid" class="week-grid"></div>
</section>

<section id="recipes" class="view">
  <div class="section-head"><h2>Recipes</h2><button class="btn primary" onclick="openRecipeModal()">＋ Add recipe</button></div>
  <div id="recipeGrid" class="recipe-grid"></div>
</section>

<section id="shopping" class="view">
  <div class="section-head"><h2>Shopping List</h2><button class="btn" onclick="clearChecked()">Clear checked</button></div>
  <div class="shopping-layout">
    <div id="shoppingList" class="card shopping-card"></div>
    <div class="card pantry-list">
      <h3>Quick add to pantry</h3>
      <div class="add-row"><input id="pantryQuickInput" placeholder="e.g. rice"><button class="btn primary" onclick="quickPantry()">Add</button></div>
      <p class="meta">Items in your pantry are automatically excluded from the shopping list.</p>
    </div>
  </div>
</section>

<section id="pantry" class="view">
  <div class="section-head"><h2>Pantry</h2></div>
  <div class="card pantry-list">
    <div class="add-row"><input id="pantryInput" placeholder="Add something you already have..."><button class="btn primary" onclick="addPantry()">Add</button></div>
    <div id="pantryItems"></div>
  </div>
</section>
</main>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<div id="dbStatus" class="status">Connecting to Supabase…</div>

<script src="js/supabase.js"></script>
<script>
const data = { recipes: [], week: {}, pantry: [], checked: [] };
let loadingRecipes = false;

const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const mealTypes = ["Breakfast","Lunch","Dinner"];

function setDbStatus(message) {
  document.getElementById("dbStatus").textContent = message;
}

async function loadRecipesFromSupabase() {
  if (loadingRecipes) return;
  loadingRecipes = true;
  try {
    const recipes = await supabaseRequest("recipes", {
      query: "?select=id,name,description,servings,cooking_time_minutes,instructions&order=name.asc"
    });
    const recipeIds = recipes.map(r => r.id);
    let ingredients = [];
    if (recipeIds.length) {
      const encoded = recipeIds.map(id => `"${id}"`).join(",");
      ingredients = await supabaseRequest("recipe_ingredients", {
        query: `?select=id,recipe_id,ingredient_id,quantity,unit,notes,sort_order,ingredients(name,category)&recipe_id=in.(${encoded})&order=sort_order.asc`
      });
    }
    data.recipes = recipes.map(r => ({
      id:r.id, name:r.name, description:r.description||"", servings:r.servings||2,
      time:r.cooking_time_minutes||30, instructions:r.instructions||"", tags:[],
      ingredients:ingredients.filter(i=>i.recipe_id===r.id).map(i=>[
        i.quantity===null ? "" : String(i.quantity),
        i.ingredients?.name||"", i.ingredients?.category||"Other", i.unit||""
      ])
    }));
    renderAll();
    setDbStatus("Connected to Supabase");
  } catch(error) {
    console.error(error);
    setDbStatus("Database connection failed");
  } finally { loadingRecipes=false; }
}

async function findIngredient(name) {
  const rows = await supabaseRequest("ingredients", {
    query:`?select=id,name,category,default_unit&name=ilike."${name.replace(/"/g,'\\"')}"&limit=1`
  });
  return rows[0]||null;
}

async function createRecipeInSupabase(recipe) {
  const rows = await supabaseRequest("recipes", {method:"POST", body:{
    name:recipe.name, description:recipe.description||null, servings:recipe.servings,
    cooking_time_minutes:recipe.time, instructions:recipe.instructions||null, user_id:null
  }});
  const created=rows[0], ingredientRows=[];
  for(let i=0;i<recipe.ingredients.length;i++){
    const [quantity,name,,unit]=recipe.ingredients[i];
    if(!name) continue;
    const ingredient=await findIngredient(name);
    if(!ingredient){
      await supabaseRequest("recipes",{method:"DELETE",query:`?id=eq.${created.id}`,prefer:"return=minimal"});
      throw new Error(`"${name}" is not currently in the global ingredient database.`);
    }
    ingredientRows.push({recipe_id:created.id,ingredient_id:ingredient.id,
      quantity:quantity===""?null:Number(quantity)||null,unit:unit||ingredient.default_unit||null,
      notes:null,sort_order:i});
  }
  if(ingredientRows.length) await supabaseRequest("recipe_ingredients",{method:"POST",body:ingredientRows});
}

async function updateRecipeInSupabase(id,recipe) {
  await supabaseRequest("recipes",{method:"PATCH",query:`?id=eq.${id}`,body:{
    name:recipe.name,description:recipe.description||null,servings:recipe.servings,
    cooking_time_minutes:recipe.time,instructions:recipe.instructions||null
  }});
  await supabaseRequest("recipe_ingredients",{method:"DELETE",query:`?recipe_id=eq.${id}`,prefer:"return=minimal"});
  const rows=[];
  for(let i=0;i<recipe.ingredients.length;i++){
    const [quantity,name,,unit]=recipe.ingredients[i];
    if(!name) continue;
    const ingredient=await findIngredient(name);
    if(!ingredient) throw new Error(`"${name}" is not currently in the global ingredient database.`);
    rows.push({recipe_id:id,ingredient_id:ingredient.id,quantity:quantity===""?null:Number(quantity)||null,
      unit:unit||ingredient.default_unit||null,notes:null,sort_order:i});
  }
  if(rows.length) await supabaseRequest("recipe_ingredients",{method:"POST",body:rows});
}

function renderWeek() {
  document.getElementById("weekGrid").innerHTML=days.map((day,di)=>{
    const meals=data.week[day]||{};
    return `<div class="card day"><div class="day-head"><div class="day-name">${day}</div><div class="day-date">${getDateForDay(di)}</div></div>
      ${mealTypes.map(type=>{
        const recipe=data.recipes.find(r=>r.id===meals[type]);
        return recipe?`<div class="meal-slot"><button class="remove-meal" onclick="removeMeal('${day}','${type}')">×</button><div class="slot-label">${type}</div><div class="meal-name">${esc(recipe.name)}</div></div>`
        :`<button class="meal-slot empty" onclick="openMealPicker('${day}','${type}')"><span>＋ ${type}</span></button>`;
      }).join("")}</div>`;
  }).join("");
}

function getDateForDay(index){
  const now=new Date(),monday=new Date(now),day=now.getDay(),diff=day===0?-6:1-day;
  monday.setDate(now.getDate()+diff+index);
  return monday.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}

function renderRecipes(){
  const grid=document.getElementById("recipeGrid");
  grid.innerHTML=data.recipes.length?data.recipes.map(r=>`<div class="card recipe-card">
    <h3>${esc(r.name)}</h3><div class="meta">Serves ${r.servings} · ${r.time} mins</div>
    <ul>${r.ingredients.slice(0,5).map(i=>`<li>${esc(i[0])} ${esc(i[1])}</li>`).join("")}${r.ingredients.length>5?"<li>…</li>":""}</ul>
    <div class="recipe-actions"><button class="btn" onclick="openRecipeModal('${r.id}')">Edit</button><button class="btn danger" onclick="deleteRecipe('${r.id}')">Delete</button></div>
  </div>`).join(""):`<div class="empty-state">No recipes yet.</div>`;
}

function buildShopping(){document.getElementById("shoppingList").innerHTML=`<div class="empty-state">Shopping list will be built from your meal plan in the next stage.</div>`;}
function renderPantry(){document.getElementById("pantryItems").innerHTML=data.pantry.length?data.pantry.map((x,i)=>`<div class="pantry-row"><span>${esc(x)}</span><button class="btn danger" onclick="removePantry(${i})">Remove</button></div>`).join(""):`<div class="empty-state">Nothing in your pantry yet.</div>`;}
function renderAll(){renderWeek();renderRecipes();buildShopping();renderPantry();}

function openMealPicker(day,type){
  document.getElementById("modal").innerHTML=`<h2>Add ${type}</h2><p class="meta">${day}</p><div class="meal-picker">${
    data.recipes.map(r=>`<button onclick="chooseMeal('${day}','${type}','${r.id}')">${esc(r.name)}<br><small>${r.time} mins</small></button>`).join("")||"<p>No recipes yet.</p>"
  }</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById("modalBackdrop").classList.add("open");
}
function chooseMeal(day,type,id){if(!data.week[day])data.week[day]={};data.week[day][type]=id;closeModal();renderAll();}
function removeMeal(day,type){if(data.week[day])delete data.week[day][type];renderAll();}
function clearWeek(){if(confirm("Clear all meals from this week?")){data.week={};renderAll();}}
function clearChecked(){data.checked=[];buildShopping();}
function quickPantry(){const i=document.getElementById("pantryQuickInput");if(i.value.trim()){data.pantry.push(i.value.trim().toLowerCase());i.value="";renderPantry();}}
function addPantry(){const i=document.getElementById("pantryInput");if(i.value.trim()){data.pantry.push(i.value.trim().toLowerCase());i.value="";renderPantry();}}
function removePantry(i){data.pantry.splice(i,1);renderPantry();}

function openRecipeModal(id=null){
  const r=id?data.recipes.find(x=>x.id===id):null;
  document.getElementById("modal").innerHTML=`<h2>${r?"Edit recipe":"Add recipe"}</h2><div class="form-grid">
    <div class="field full"><label>Name</label><input id="rName" value="${r?esc(r.name):""}" placeholder="e.g. Chilli con carne"></div>
    <div class="field"><label>Servings</label><input id="rServings" type="number" min="1" value="${r?r.servings:2}"></div>
    <div class="field"><label>Cooking time (minutes)</label><input id="rTime" type="number" min="1" value="${r?r.time:30}"></div>
    <div class="field full"><label>Ingredients — quantity | ingredient | category | unit</label><textarea id="rIngredients" placeholder="500 | Beef mince | Meat | g">${r?r.ingredients.map(x=>x.join(" | ")).join("\\n"):""}</textarea></div>
  </div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRecipe('${r?r.id:""}')">Save recipe</button></div>`;
  document.getElementById("modalBackdrop").classList.add("open");
}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open");}

async function saveRecipe(id){
  const name=document.getElementById("rName").value.trim();
  if(!name)return alert("Please give the recipe a name.");
  const ingredients=document.getElementById("rIngredients").value.split("\n").map(x=>x.split("|").map(y=>y.trim())).filter(x=>x[0]&&x[1]).map(x=>[x[0],x[1],x[2]||"Other",x[3]||""]);
  const recipe={id:id||null,name,description:"",servings:Number(document.getElementById("rServings").value)||2,time:Number(document.getElementById("rTime").value)||30,tags:[],ingredients};
  try{
    if(id) await updateRecipeInSupabase(id,recipe); else await createRecipeInSupabase(recipe);
    closeModal();await loadRecipesFromSupabase();
  }catch(error){console.error(error);alert(error.message||"Couldn't save the recipe.");}
}
async function deleteRecipe(id){
  if(!confirm("Delete this recipe?"))return;
  try{await supabaseRequest("recipes",{method:"DELETE",query:`?id=eq.${id}`,prefer:"return=minimal"});data.week={};await loadRecipesFromSupabase();}
  catch(error){console.error(error);alert("Couldn't delete the recipe.");}
}

document.querySelectorAll(".nav a[data-view]").forEach(link=>{
  link.addEventListener("click",event=>{
    event.preventDefault();
    document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("active"));
    link.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById(link.dataset.view).classList.add("active");
  });
});

renderAll();
loadRecipesFromSupabase();
</script>
</body>
</html>
