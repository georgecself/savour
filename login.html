<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var pref = localStorage.getItem('savour_theme') || 'system';
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .auth-card { width:min(380px, 90vw); padding:28px; }
  .auth-card h1 { margin:0 0 4px; }
  .auth-card p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; box-sizing:border-box; }
  .auth-actions { margin-top:18px; }
  .auth-actions .btn { width:100%; box-sizing:border-box; }
  .switch-mode { text-align:center; margin-top:14px; font-size:13px; color:var(--muted); }
  .switch-mode a { color:var(--accent-dark); cursor:pointer; text-decoration:underline; }
  .auth-message { font-size:13px; margin-top:12px; padding:10px; border-radius:8px; }
  .auth-message.error { background:var(--rust-soft); color:var(--rust); }
  .auth-message.success { background:var(--accent-soft); color:var(--accent-dark); }
</style>
</head>
<body>
<div class="card auth-card">
  <div style="text-align:center; margin-bottom:6px;">
    <svg width="60" height="60" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="13" cy="13" r="12" style="stroke:var(--accent)" stroke-width="2"/>
      <path d="M8 14c0-3 2.2-6 5-6s5 3 5 6-2.2 4-5 4-5-1-5-4Z" style="fill:var(--accent)"/>
      <path d="M13 8V5" style="stroke:var(--accent)" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <h1 style="text-align:center;">Savour</h1>
  <p class="sub" id="authSubtitle" style="text-align:center;">Sign in to your account</p>

  <div id="nameFields" style="display:none;">
    <div class="field"><label>First name</label><input id="authFirstName" placeholder="George"></div>
    <div class="field"><label>Last name</label><input id="authLastName" placeholder="Self"></div>
  </div>

  <div class="field">
    <label>Email</label>
    <input id="authEmail" type="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input id="authPassword" type="password" placeholder="••••••••">
  </div>

  <div class="auth-actions">
    <button class="btn primary" style="border-radius:999px;" id="authSubmitBtn" onclick="handleSubmit()">Sign in</button>
  </div>

  <div class="switch-mode">
    <span id="switchModeText">Don't have an account? <a onclick="switchMode()">Sign up</a></span>
  </div>

  <div id="authMessage"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/login.js"></script>
</body>
</html>
