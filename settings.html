<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  if (localStorage.getItem('savour_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .settings-card { padding:22px; max-width:480px; margin-bottom:18px; }
  .settings-card h3 { margin-bottom:14px; }
  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; box-sizing:border-box; }
</style>
</head>
<body>

<h2 style="margin-bottom:22px;">Settings</h2>

<div class="card settings-card">
  <h3>Profile</h3>
  <div class="field"><label>Display name</label><input id="sName" placeholder="e.g. George"></div>
  <div class="field"><label>Avatar URL</label><input id="sAvatar" placeholder="Optional — link to an image already online"></div>
  <div class="field"><label>Account type</label><input id="sAccountType" placeholder="e.g. Free"></div>
  <button class="btn primary" onclick="saveProfile()">Save profile</button>
</div>

<div class="card settings-card">
  <h3>Password</h3>
  <div class="field"><label>New password</label><input id="sPassword" type="password" placeholder="At least 6 characters"></div>
  <button class="btn" onclick="changePassword()">Update password</button>
</div>

<div class="card settings-card">
  <h3>Account</h3>
  <button class="btn danger" onclick="handleSignOut()">Sign out</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
