<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var pref = localStorage.getItem('savour_theme') || 'system';
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .settings-card { padding:22px; max-width:480px; margin-bottom:18px; }
  .settings-card h3 { margin-bottom:14px; }
  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; box-sizing:border-box; }
  .readonly-value { padding:10px 0; color:var(--muted); font-size:14px; }
  .theme-pill { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); width:fit-content; }
  .theme-pill button { border:0; background:transparent; color:var(--text); padding:9px 18px; cursor:pointer; font-size:14px; font-family:var(--font-body); position:relative; }
  .theme-pill button:not(:last-child)::after { content:""; position:absolute; right:0; top:22%; bottom:22%; width:1px; background:var(--line); }
  .theme-pill button:hover { background:var(--surface-2); }
  .theme-pill button.active { background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
</style>
</head>
<body>

<h2 style="margin-bottom:22px;">Settings</h2>

<div class="card settings-card">
  <h3>Profile</h3>
  <div class="field"><label>First name</label><input id="sFirstName" placeholder="e.g. George"></div>
  <div class="field"><label>Last name</label><input id="sLastName" placeholder="e.g. Self"></div>
  <div class="field"><label>Avatar URL</label><input id="sAvatar" placeholder="Optional — link to an image already online"></div>
  <div class="field">
    <label>Account type</label>
    <div class="readonly-value" id="sAccountTypeDisplay">Free</div>
  </div>
  <button class="btn primary" style="border-radius:999px;" onclick="saveProfile()">Save profile</button>
</div>

<div class="card settings-card">
  <h3>Appearance</h3>
  <p class="meta" style="margin-top:0; margin-bottom:14px;">Choose how Savour looks, or have it follow your device automatically.</p>
  <div class="theme-pill" id="themePill"></div>
</div>

<div class="card settings-card">
  <h3>Password</h3>
  <div class="field"><label>New password</label><input id="sPassword" type="password" placeholder="At least 6 characters"></div>
  <button class="btn" style="border-radius:999px;" onclick="changePassword()">Update password</button>
</div>

<div class="card settings-card">
  <h3>Account</h3>
  <button class="btn danger" style="border-radius:999px;" onclick="handleSignOut()">Sign out</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
