<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Bulk Import Foods</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .import-wrap { max-width:720px; margin:0 auto; }
  .card.import-card { padding:24px; margin-bottom:20px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .drop-zone { border:2px dashed var(--line); border-radius:14px; padding:30px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop-zone.dragover { border-color:var(--accent); background:var(--accent-soft); }
  .drop-zone input { display:none; }
  .checkbox-row { display:flex; align-items:center; gap:8px; font-size:14px; margin:14px 0; }
  .checkbox-row input { width:17px; height:17px; accent-color:var(--accent); }
  .file-name { font-size:13px; color:var(--accent-dark); margin-top:8px; }

  .results-list { margin-top:12px; }
  .result-row { display:flex; align-items:flex-start; gap:8px; padding:9px 0; border-bottom:1px solid #f0f0ed; font-size:13px; }
  .result-row:last-child { border-bottom:0; }
  .result-ok { color: #2e7d4f; }
  .result-fail { color: #c0392b; }
  .summary-bar { display:flex; gap:12px; margin-bottom:10px; }
  .summary-pill { background:var(--accent-soft); color:var(--accent-dark); padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  code { background:#f0f0ed; padding:1px 5px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="index.html">📅 Week</a>
    <a href="recipes.html">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="foods.html" class="active">🥫 Foods</a>
    <a href="shopping.html">🛒 Shopping</a>
    <a href="pantry.html">📦 Pantry</a>
  </nav>
</header>

<main>
<div class="import-wrap" id="pageContent">
  <!-- populated by JS after the admin check -->
</div>
</main>
</div>

<div id="status" class="status">Connecting to Supabase…</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/foods-import.js"></script>
</body>
</html>
