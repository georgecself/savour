<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Deal Check</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .deal-wrap { max-width:560px; margin:0 auto; }
  .card.section-card { padding:22px; margin-bottom:18px; }
  .type-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .type-btn { flex:1; border:1px solid var(--line); background:white; border-radius:10px; padding:10px; cursor:pointer; font-size:14px; }
  .type-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }
  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; box-sizing:border-box; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field.full { grid-column:1/-1; }

  .pick-options { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .pick-option { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f0f0ed; }
  .pick-option:last-child { border-bottom:0; }
  .pick-option:hover { background:var(--accent-soft); }
  .pick-options .empty-state { padding:16px; font-size:13px; }

  .selection-banner { background:var(--accent-soft); color:var(--accent-dark); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .selection-banner button { border:0; background:transparent; color:var(--accent-dark); font-size:12px; text-decoration:underline; cursor:pointer; }
  .guide-note { color:var(--muted); font-size:13px; margin-bottom:16px; }

  .verdict { border-radius:16px; padding:20px; text-align:center; margin-bottom:16px; }
  .verdict.good { background:#eaf6ec; }
  .verdict.typical { background:#fdf6e3; }
  .verdict.bad { background:#fdeceb; }
  .verdict.unknown { background:#f4f4f2; }
  .verdict-emoji { font-size:34px; }
  .verdict-label { font-size:18px; font-weight:700; margin-top:4px; }
  .verdict-detail { font-size:13px; color:var(--muted); margin-top:4px; }

  .checkbox-row { display:flex; align-items:center; gap:8px; font-size:14px; margin:12px 0; }
  .checkbox-row input { width:17px; height:17px; accent-color:var(--accent); }

  .recipe-suggest { margin-top:6px; }
  .recipe-suggest h3 { font-size:14px; margin:0 0 10px; }
  .suggest-list { list-style:none; padding:0; margin:0; }
  .suggest-list li { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #f0f0ed; font-size:14px; }
  .suggest-list li:last-child { border-bottom:0; }
  .suggest-sub { color:var(--muted); font-size:12px; }
  .footer-link { text-align:center; margin-top:6px; }
  .footer-link a { color:var(--muted); font-size:12px; }

  @media(max-width:500px){ .form-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="index.html">📅 Week</a>
    <a href="recipes.html">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="foods.html">🥫 Foods</a>
    <a href="shopping.html">🛒 Shopping</a>
    <a href="pantry.html">📦 Pantry</a>
    <a href="deal-check.html" class="active">🎯 Deal Check</a>
  </nav>
</header>

<main>
<div class="deal-wrap">
  <h2 style="margin-bottom:16px;">Is this a good deal?</h2>

  <div class="card section-card" id="pickSection">
    <div class="type-toggle">
      <button type="button" class="type-btn active" id="typeBtnIngredient" onclick="switchType('ingredient')">🥕 Ingredient</button>
      <button type="button" class="type-btn" id="typeBtnFood" onclick="switchType('food')">🥫 Food</button>
    </div>
    <div class="field">
      <label>What are you looking at?</label>
      <input id="pickSearch" placeholder="Type to search…" oninput="renderPickOptions()">
    </div>
    <div id="pickOptions" class="pick-options"></div>
  </div>

  <div id="detailsSection" style="display:none;"></div>
</div>
</main>
</div>

<div id="status" class="status">Connecting to Supabase…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/deal-check.js"></script>
</body>
</html>
