<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  if (localStorage.getItem('savour_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Recipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .recipe-view { max-width:780px; margin:0 auto; }

  .icon-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; text-decoration:none; }
  .icon-btn:hover { background:var(--surface-2); border-color:var(--muted); }

  .hero-img { width:100%; height:320px; object-fit:cover; border-radius:16px; margin-bottom:18px; background:var(--line); }
  .hero-placeholder { width:100%; height:320px; border-radius:16px; margin-bottom:18px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }

  .rv-header { margin-bottom:18px; }
  .rv-header h1 { margin:0 0 8px; }
  .rv-description { color:var(--muted); margin:2px 0 0; }
  .rv-badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .rv-meta { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:10px; }
  .rv-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dark); background:var(--accent-soft); padding:3px 9px; border-radius:999px; }
  .rv-badge.category { color:var(--gold-dark); background:var(--gold-soft); }
  .rv-actions { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }

  .rv-columns { display:grid; grid-template-columns:280px 1fr; gap:26px; margin-top:16px; }
  .rv-card { padding:20px; }
  .servings-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .servings-row input { width:64px; padding:8px; text-align:center; }
  .ing-list { list-style:none; padding:0; margin:0; }
  .ing-list li { display:flex; align-items:baseline; gap:9px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .ing-list li:last-child { border-bottom:0; }
  .ing-qty { font-weight:600; min-width:60px; }

  .cook-toggle-card { padding:0; overflow:hidden; margin-top:16px; }
  .cook-toggle-header { display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; }
  .cook-toggle-header:hover { background:var(--surface-2); }
  .cook-toggle-icon { width:42px; height:42px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cook-toggle-text { flex:1; }
  .cook-toggle-title { font-weight:600; font-size:15px; }
  .cook-toggle-sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .cook-toggle-chevron { flex-shrink:0; transition:transform .25s ease; }
  .cook-toggle-card.expanded .cook-toggle-chevron { transform:rotate(90deg); }

  .instructions { white-space:pre-wrap; font-size:15px; line-height:1.7; }
  .instructions ol { padding-left:22px; margin:0; }
  .instructions li { margin-bottom:14px; }

  .cook-toggle-body { max-height:0; overflow:hidden; text-align:center; padding:0 20px; transition:max-height .3s ease, padding .3s ease; }
  .cook-toggle-card.expanded .cook-toggle-body { padding:4px 20px 26px; border-top:1px solid var(--line); }
  .cook-step-count { color:var(--muted); font-size:13px; margin-top:16px; }
  .cook-step-text { font-size:22px; line-height:1.5; margin:14px 0 22px; min-height:90px; display:flex; align-items:center; justify-content:center; }
  .cook-nav { display:flex; justify-content:center; gap:12px; }
  .cook-nav .btn { border-radius:999px; padding:10px 22px; }
  .cook-nav button:disabled { opacity:.4; cursor:default; }

  .empty-state { color:var(--muted); padding:40px; text-align:center; }

  @media(max-width:750px){ .rv-columns{grid-template-columns:1fr} .hero-img,.hero-placeholder{height:220px} }
</style>
</head>
<body>

<div class="recipe-view">
  <div style="margin-bottom:16px;">
    <a class="icon-btn" href="recipes.html" title="Back to recipes" aria-label="Back to recipes">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </a>
  </div>
  <div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/recipe-view.js"></script>
</body>
</html>
