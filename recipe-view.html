<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Recipe</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .recipe-view { max-width:760px; margin:0 auto; }
  .back-link { display:inline-block; margin-bottom:14px; color:var(--muted); font-size:13px; text-decoration:none; }
  .hero-img { width:100%; max-height:340px; object-fit:cover; border-radius:16px; margin-bottom:18px; background:#f0f0ed; }
  .rv-header { margin-bottom:18px; }
  .rv-header h1 { margin:0 0 6px; }
  .rv-description { color:var(--muted); margin:6px 0 0; }
  .rv-meta { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:8px; }
  .rv-badge { display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dark); background:var(--accent-soft); padding:3px 9px; border-radius:999px; }
  .rv-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

  .rv-columns { display:grid; grid-template-columns:280px 1fr; gap:26px; margin-top:10px; }
  .rv-card { padding:20px; }
  .servings-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .servings-row input { width:64px; padding:8px; border:1px solid var(--line); border-radius:8px; text-align:center; }
  .ing-list { list-style:none; padding:0; margin:0; }
  .ing-list li { display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid #f0f0ed; font-size:14px; }
  .ing-list li:last-child { border-bottom:0; }
  .ing-list input[type=checkbox] { width:17px; height:17px; accent-color:var(--accent); flex-shrink:0; }
  .ing-list li.checked span { text-decoration:line-through; color:#aaa; }
  .ing-qty { font-weight:600; min-width:60px; }

  .instructions { white-space:pre-wrap; font-size:15px; line-height:1.7; }
  .instructions ol { padding-left:22px; margin:0; }
  .instructions li { margin-bottom:14px; }

  .cook-mode { display:none; }
  .cook-mode.active { display:block; }
  .cook-mode .card { padding:32px; text-align:center; }
  .cook-step-count { color:var(--muted); font-size:13px; margin-bottom:10px; }
  .cook-step-text { font-size:22px; line-height:1.5; margin-bottom:24px; min-height:110px; display:flex; align-items:center; justify-content:center; }
  .cook-nav { display:flex; justify-content:center; gap:12px; }
  .cook-nav button:disabled { opacity:.4; cursor:default; }

  .empty-state { color:var(--muted); padding:40px; text-align:center; }

  @media(max-width:750px){ .rv-columns{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="index.html">📅 Week</a>
    <a href="recipes.html" class="active">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="foods.html">🥫 Foods</a>
    <a href="shopping.html">🛒 Shopping</a>
    <a href="pantry.html">📦 Pantry</a>
    <a href="prices.html">💰 Prices</a>
  </nav>
</header>

<main>
<div class="recipe-view">
  <a class="back-link" href="recipes.html">← Back to recipes</a>
  <div id="content"></div>
</div>
</main>
</div>

<div id="status" class="status">Connecting to Supabase…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/recipe-view.js"></script>
</body>
</html>
