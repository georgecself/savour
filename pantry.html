<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  if (localStorage.getItem('savour_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
  .toolbar input { flex:1; max-width:320px; }
  .pantry-table { width:100%; border-collapse:collapse; }
  .pantry-table th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:12px 14px; border-bottom:1px solid var(--line); }
  .pantry-table td { padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  .pantry-table tr:last-child td { border-bottom:0; }
  .pantry-table .num { color:var(--muted); }
  .empty-state { color:var(--muted); padding:30px; text-align:center; }
  .table-card { padding:0; overflow-x:auto; }

  .row-actions { display:flex; gap:6px; }
  .row-icon-btn { width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .row-icon-btn:hover { background:var(--surface-2); }
  .row-icon-btn.danger:hover { background:var(--rust-soft); border-color:var(--rust); color:var(--rust); }

  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(43,38,32,.4); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(520px,100%); max-height:90vh; overflow:auto; background:var(--surface); border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; margin-bottom:4px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }

  .type-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .type-btn { flex:1; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:10px; padding:10px; cursor:pointer; font-size:14px; }
  .type-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }

  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; box-sizing:border-box; }
  .qty-unit-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .pick-options { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .pick-option { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .pick-option:last-child { border-bottom:0; }
  .pick-option:hover { background:var(--accent-soft); }
  .pick-option .sub { color:var(--muted); font-size:11px; margin-top:1px; }
  .pick-options .empty-state { padding:16px; font-size:13px; }

  .selection-banner { background:var(--accent-soft); color:var(--accent-dark); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .selection-banner button { border:0; background:transparent; color:var(--accent-dark); font-size:12px; text-decoration:underline; cursor:pointer; }

  @media(max-width:650px){ .qty-unit-row{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="section-head">
  <h2>Pantry</h2>
  <button class="btn primary" style="border-radius:999px;" id="addPantryBtn">＋ Add item</button>
</div>
<p class="meta" style="color:var(--muted); font-size:13px; margin-top:-8px; margin-bottom:16px;">
  What you've already got. Items here are subtracted from your shopping list automatically.
</p>
<div class="toolbar">
  <input id="searchInput" placeholder="Search pantry…">
</div>
<div class="card table-card">
  <div id="pantryTable"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/pantry.js"></script>
</body>
</html>
