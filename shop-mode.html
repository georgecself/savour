<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var pref = localStorage.getItem('savour_theme') || 'system';
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Shop Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .icon-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--surface-2); border-color:var(--muted); }
  .toolbar-row { display:flex; align-items:center; gap:10px; }
  .week-nav-pill { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); }
  .week-nav-pill button { border:0; background:transparent; color:var(--text); padding:9px 18px; cursor:pointer; font-size:14px; font-family:var(--font-body); position:relative; }
  .week-nav-pill button:not(:last-child)::after { content:""; position:absolute; right:0; top:22%; bottom:22%; width:1px; background:var(--line); }
  .week-nav-pill button:hover { background:var(--surface-2); }

  .big-deal-btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:18px; margin:16px 0 22px;
    background:var(--accent); color:#fff; border:0; border-radius:16px;
    font-size:16px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  }
  .big-deal-btn:hover { background:var(--accent-dark); }

  .sm-summary { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .sm-summary-stat { flex:1; min-width:100px; text-align:center; padding:12px 8px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .sm-summary-value { display:block; font-family:var(--font-display); font-size:20px; font-weight:600; }
  .sm-summary-label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-top:2px; }

  .sm-category { margin-bottom:16px; }
  .sm-category h3 { font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 8px; padding:0 4px; }
  .sm-list { border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface); }
  .sm-item-row {
    display:flex; align-items:center; gap:14px; padding:18px 16px;
    border-bottom:1px solid var(--line); cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .sm-item-row:last-child { border-bottom:0; }
  .sm-item-row:active { background:var(--surface-2); }
  .sm-item-row.done { opacity:.5; }
  .sm-item-row.done .sm-item-label { text-decoration:line-through; }
  .sm-check { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:transparent; }
  .sm-item-row.done .sm-check { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sm-item-body { flex:1; min-width:0; }
  .sm-item-label { font-size:17px; font-weight:600; }
  .sm-item-qty { font-size:13px; color:var(--muted); margin-top:2px; }
  .sm-item-price { font-size:13px; color:var(--accent-dark); font-weight:600; white-space:nowrap; }

  .sm-category.quiet h3 { color:var(--muted); }
  .sm-category.quiet.covered h3 { color:var(--success); }
  .sm-category.quiet.reminder h3 { color:var(--gold-dark); }
  .sm-list.covered { background:var(--success-soft); border-color:var(--success-soft); }
  .sm-list.covered .sm-item-row { border-bottom-color:rgba(0,0,0,.06); }
  .sm-list.covered .sm-item-label { color:var(--success); }
  .sm-list.reminder { background:var(--gold-soft); border-color:var(--gold-soft); }
  .sm-list.reminder .sm-item-row { border-bottom-color:rgba(0,0,0,.06); }
  .sm-list.reminder .sm-item-label { color:var(--gold-dark); }
  .sm-list.quiet .sm-item-row { padding:12px 16px; cursor:default; }
  .sm-list.quiet .sm-item-label { font-size:14px; font-weight:500; }

  .empty-state { color:var(--muted); padding:40px; text-align:center; }

  /* Confirm-quantity modal */
  .sm-qty-modal h2 { margin-bottom:2px; }
  .sm-qty-need { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .sm-stepper { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:6px; }
  .sm-stepper button { width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:24px; cursor:pointer; color:var(--text); flex-shrink:0; }
  .sm-stepper button:hover { background:var(--surface-2); }
  .sm-qty-input { width:120px; text-align:center; font-size:32px; font-family:var(--font-display); font-weight:600; border:0; background:transparent; padding:0; }
  .sm-qty-unit-label { text-align:center; color:var(--muted); font-size:14px; margin-bottom:26px; }
  .sm-qty-actions { display:flex; flex-direction:column; gap:10px; }
  .sm-qty-actions .btn { width:100%; padding:14px; font-size:15px; }

  /* Modal + deal-checker widget styling (shared markup, page-owned CSS,
     same convention as every other modal-using page) */
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(43,38,32,.4); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(480px,100%); max-height:90vh; overflow:auto; background:var(--surface); border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; margin-bottom:4px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; box-sizing:border-box; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field.full { grid-column:1/-1; }
  .type-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .type-btn { flex:1; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:10px; padding:10px; cursor:pointer; font-size:14px; }
  .type-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }
  .pick-options { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .pick-option { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .pick-option:last-child { border-bottom:0; }
  .pick-option:hover { background:var(--accent-soft); }
  .selection-banner { background:var(--accent-soft); color:var(--accent-dark); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .selection-banner button { border:0; background:transparent; color:var(--accent-dark); font-size:12px; text-decoration:underline; cursor:pointer; }
  .guide-note { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .verdict { border-radius:16px; padding:22px; text-align:center; margin:16px 0; }
  .verdict.good { background:var(--success-soft); }
  .verdict.typical { background:var(--gold-soft); }
  .verdict.bad { background:var(--rust-soft); }
  .verdict.unknown { background:var(--surface-2); }
  .verdict-icon { display:flex; align-items:center; justify-content:center; }
  .verdict.good .verdict-icon, .verdict.good .verdict-label { color:var(--success); }
  .verdict.bad .verdict-icon, .verdict.bad .verdict-label { color:var(--rust); }
  .verdict.typical .verdict-icon, .verdict.typical .verdict-label { color:var(--gold-dark); }
  .verdict.unknown .verdict-icon, .verdict.unknown .verdict-label { color:var(--muted); }
  .verdict-label { font-size:18px; font-weight:700; margin-top:8px; }
  .verdict-detail { font-size:13px; color:var(--muted); margin-top:4px; }
  .checkbox-row { display:flex; align-items:center; gap:8px; font-size:14px; margin:12px 0; }
  .checkbox-row input { width:17px; height:17px; accent-color:var(--accent); }
  .recipe-suggest h3 { font-size:14px; margin:16px 0 10px; }
  .suggest-list { list-style:none; padding:0; margin:0; }
  .suggest-list li { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; gap:10px; }
  .suggest-list li:last-child { border-bottom:0; }
  .suggest-sub { color:var(--muted); font-size:12px; }

  @media(max-width:500px){ .sm-summary-stat{min-width:80px;} .form-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="section-head">
  <h2 id="weekHeading">Shop Mode</h2>
  <div class="toolbar-row">
    <div class="week-nav-pill">
      <button onclick="navigateWeek(-1)" title="Previous week" aria-label="Previous week">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button onclick="jumpToToday()">Today</button>
      <button onclick="navigateWeek(1)" title="Next week" aria-label="Next week">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<button class="big-deal-btn" onclick="openDealCheckModal()">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12.6 12 21l-9-9V4h8l9.4 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/></svg>
  Check a deal
</button>

<div id="summaryBar"></div>
<div id="listContainer"></div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/units.js"></script>
<script src="js/shopping-data.js"></script>
<script src="js/deal-checker-widget.js"></script>
<script src="js/shop-mode.js"></script>
</body>
</html>
