<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Shopping List</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .summary-bar { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .summary-pill { background:var(--accent-soft); color:var(--accent-dark); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; }
  .summary-note { color:var(--muted); font-size:12px; }

  .category { margin-bottom:22px; }
  .category h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  .category-card { padding:6px 0; }
  .shop-row { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid #f0f0ed; }
  .shop-row:last-child { border-bottom:0; }
  .shop-row input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; }
  .shop-row.checked .shop-label { text-decoration:line-through; color:#aaa; }
  .shop-label { flex:1; font-size:14px; }
  .shop-icon { margin-right:4px; }
  .shop-qty { color:var(--muted); font-size:13px; white-space:nowrap; }
  .shop-price { color:var(--accent-dark); font-size:13px; font-weight:600; white-space:nowrap; }
  .empty-state { color:var(--muted); padding:40px; text-align:center; }
  .refresh-btn { border:0; background:transparent; cursor:pointer; font-size:16px; color:var(--muted); }
  .complete-shop-bar { margin-top:10px; text-align:center; }

  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.38); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:white; border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; margin-bottom:4px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
  .mark-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f0f0ed; }
  .mark-row:last-child { border-bottom:0; }
  .mark-row-name { flex:1; font-size:14px; }
  .mark-row input { width:90px; padding:8px; border:1px solid var(--line); border-radius:8px; text-align:right; }
  .mark-row-unit { width:50px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>Savour</h1>
    <p>Plan your week. Know what to buy. Waste less.</p>
  </div>
  <nav class="nav">
    <a href="index.html">📅 Week</a>
    <a href="recipes.html">🍳 Recipes</a>
    <a href="ingredients.html">🥕 Ingredients</a>
    <a href="foods.html">🥫 Foods</a>
    <a href="shopping.html" class="active">🛒 Shopping</a>
    <a href="pantry.html">📦 Pantry</a>
    <a href="deal-check.html">🎯 Deal Check</a>
  </nav>
</header>

<main>
<section id="shopping" class="view active">
  <div class="section-head">
    <h2 id="weekHeading">Shopping List <button class="refresh-btn" onclick="loadShoppingList()" title="Refresh">⟳</button></h2>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn" onclick="navigateWeek(-1)">◀</button>
      <button class="btn" onclick="jumpToToday()">Today</button>
      <button class="btn" onclick="navigateWeek(1)">▶</button>
      <button class="btn" onclick="clearChecked()">Clear ticks</button>
    </div>
  </div>
  <div id="summaryBar" class="summary-bar"></div>
  <div id="listContainer"></div>
  <div class="complete-shop-bar" id="completeShopBar" style="display:none;">
    <button class="btn primary" onclick="openCompleteShopModal()">✅ Complete shop — add ticked items to pantry</button>
  </div>
</section>
</main>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<div id="dbStatus" class="status">Connecting to Supabase…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shopping.js"></script>
</body>
</html>
