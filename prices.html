<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var pref = localStorage.getItem('savour_theme') || 'system';
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savour — Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  .icon-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--surface-2); border-color:var(--muted); }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input { flex:1; max-width:320px; }
  .group { margin-bottom:20px; }
  .group h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .price-card { padding:0; overflow-x:auto; }
  .price-table { width:100%; border-collapse:collapse; min-width:620px; }
  .price-table th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .price-table td { padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; white-space:nowrap; }
  .price-table tr:last-child td { border-bottom:0; }
  .price-table tr.best td { background:var(--success-soft); }
  .best-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--success); background:var(--success-soft); padding:2px 7px; border-radius:999px; margin-left:6px; }
  .deal-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold-dark); background:var(--gold-soft); padding:2px 7px; border-radius:999px; margin-left:6px; }
  .unit-price { font-weight:600; }
  .logged-date { color:var(--muted); font-size:13px; }
  .row-actions { display:flex; gap:6px; }
  .row-icon-btn { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .row-icon-btn:hover { background:var(--surface-2); }
  .row-icon-btn.danger:hover { background:var(--rust-soft); border-color:var(--rust); color:var(--rust); }
  .empty-state { color:var(--muted); padding:30px; text-align:center; }

  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(43,38,32,.4); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--surface); border-radius:20px; padding:24px; }
  .modal h2 { margin-top:0; margin-bottom:4px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }

  .type-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .type-btn { flex:1; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:10px; padding:10px; cursor:pointer; font-size:14px; }
  .type-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }

  .field { margin-bottom:13px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field input { width:100%; box-sizing:border-box; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field.full { grid-column:1/-1; }

  .pick-options { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .pick-option { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .pick-option:last-child { border-bottom:0; }
  .pick-option:hover { background:var(--accent-soft); }
  .pick-options .empty-state { padding:16px; font-size:13px; }
  .selection-banner { background:var(--accent-soft); color:var(--accent-dark); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .selection-banner button { border:0; background:transparent; color:var(--accent-dark); font-size:12px; text-decoration:underline; cursor:pointer; }
  .checkbox-row { display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0 14px; }
  .checkbox-row input { width:17px; height:17px; accent-color:var(--accent); }

  @media(max-width:650px){ .form-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="section-head">
  <h2>Prices</h2>
  <button class="icon-btn" id="addPriceBtn" title="Log a price" aria-label="Log a price" style="display:none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>
<p class="meta" style="color:var(--muted); font-size:13px; margin-top:-8px; margin-bottom:16px;">
  Logged prices, kept up to date by George. Cheapest-per-unit is worked out automatically, so multipacks and own-brand vs premium compare fairly.
</p>
<div class="toolbar">
  <input id="searchInput" placeholder="Search…">
</div>
<div id="priceGroups"></div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/shell.js"></script>
<script src="js/prices.js"></script>
</body>
</html>
